/* ---------- Hook reveal ---------- */
function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });

    const amatiSemua = () => {
      document.querySelectorAll('.reveal:not(.in-view)').forEach((el) => io.observe(el));
    };
    amatiSemua();

    /* Konten yang muncul/berubah belakangan (misal kartu katalog yang
       ke-render pas skeleton loading diganti sama kartu asli — React kadang
       nge-reuse elemen yang sama & cuma ganti classnya, bukan bikin elemen
       DOM baru) nggak ke-observe di scan awal. Tanpa ini, elemen semacam itu
       bakal nyangkut selamanya di opacity:0. Jadi tiap ada perubahan DOM
       apapun (childList ATAU class), scan ulang semua .reveal yang belum
       ke-observe. */
    const mo = new MutationObserver(amatiSemua);
    mo.observe(document.body, { childList: true, subtree: true, attributes: true, attributeFilter: ['class'] });

    return () => { io.disconnect(); mo.disconnect(); };
  }, []);
}

function HeroTestimonials() {
  const base = TESTIMONIALS;
  const n = base.length;
  const track = [...base, ...base, ...base]; // 3 salinan biar bisa muter tanpa putus
  const [center, setCenter] = useState(n); // mulai di salinan tengah
  const [animOn, setAnimOn] = useState(true);
  const rebasingRef = useRef(false);

  useEffect(() => {
    const iv = setInterval(() => {
      setAnimOn(true);
      setCenter((c) => c + 1);
    }, 4000);
    return () => clearInterval(iv);
  }, []);

  useEffect(() => {
    if (center >= n * 2 && !rebasingRef.current) {
      rebasingRef.current = true;
      const t1 = setTimeout(() => {
        setAnimOn(false);
        setCenter((c) => c - n);
        setTimeout(() => { setAnimOn(true); rebasingRef.current = false; }, 60);
      }, 700);
      return () => clearTimeout(t1);
    }
  }, [center, n]);

  const trans = animOn ? "transform 700ms cubic-bezier(.34,1.2,.5,1), opacity 700ms ease" : "none";
  const edgeMask = "linear-gradient(to bottom, transparent 0%, #000 14%, #000 86%, transparent 100%)";

  return (
    <div className="relative w-full max-w-[380px] mx-auto lg:mx-0 overflow-hidden"
         style={{ height: TESTI_SLOT_H * 3, maskImage: edgeMask, WebkitMaskImage: edgeMask }}>
      {track.map((t, i) => {
        const rel = i - center; // -1 atas(kecil) · 0 tengah(besar) · 1 bawah(kecil) · 2 buffer
        if (rel < -1 || rel > 2) return null;
        const bright = rel === 0;
        // slot tengah punya ruang penuh; kartu diperkecil untuk yang di samping
        const scale = bright ? 1 : 0.82;
        const centerY = TESTI_SLOT_H * (rel + 1) + TESTI_SLOT_H / 2; // titik tengah slot
        return (
          <div key={i} className="absolute inset-x-1 flex items-center justify-center"
               style={{
                 top: 0, height: TESTI_SLOT_H,
                 transform: `translateY(${centerY - TESTI_SLOT_H / 2}px) scale(${scale})`,
                 transformOrigin: "center center",
                 opacity: rel === 2 ? 0 : bright ? 1 : 0.55,
                 transition: trans,
                 pointerEvents: bright ? "auto" : "none",
                 zIndex: bright ? 10 : 1,
               }}>
            <TestiCardInner t={t} />
          </div>
        );
      })}
    </div>
  );
}

const MODE_INFO = {

  "live-teaching": { label: "Live Teaching", bg: "bg-sun",  },

const formatJam = (detik) => {
  if (!detik) return "0 Jam";
  const jam = Math.floor(detik / 3600);
  const menit = Math.round((detik % 3600) / 60);
  if (jam === 0) return `${menit} Menit`;
  return menit === 0 ? `${jam} Jam` : `${jam} Jam ${menit} Menit`;
};

/* Ubah 1 baris tabel `maddah` di Supabase jadi bentuk yang dipakai MaddahCard
   — sama persis dengan bentukKatalogItem di ruang-belajar.html, biar data
   yang tampil di sini selalu konsisten sama katalog.html & ruang belajar. */
const bentukKatalogItem = (row, ringkasan) => ({
  id: row.id,
  name: row.nama,
  teacher: row.pengajar || "",
  jurusan: row.jurusan || "",
  tingkat: row.tingkat,
  termin: row.termin,
  episodes: ringkasan ? ringkasan.jumlah_video : 0,
  duration: formatJam(ringkasan ? ringkasan.total_durasi : 0),
  jumlahPertemuan: row.jumlah_pertemuan || 0,
  price: row.harga || 0,
  originalPrice: row.harga_coret || row.harga || 0,
  badge: row.badge || null,
  mode: row.mode || "e-learning",
  status: row.buka_status || "open",
  cover: row.cover_url || "",
});

async function ambilSemuaKatalog() {
  const { data: rows, error } = await sb.from("maddah").select("*").eq("published", true).order("created_at");
  if (error) throw error;
  if (!rows || rows.length === 0) return [];
  return Promise.all(rows.map(async (row) => {
    const { data: ring } = await sb.rpc("maddah_ringkasan", { p_maddah_id: row.id });
    return bentukKatalogItem(row, ring && ring[0]);

function MaddahCarousel({ list }) {
  const perSlide = 4;
  const groups = [];
  for (let i = 0; i < list.length; i += perSlide) groups.push(list.slice(i, i + perSlide));
  const totalSlides = groups.length;

  const [slide, setSlide] = useState(0);
  const dragRef = useRef({ x: 0, dragging: false });

  const go = (i) => setSlide(((i % totalSlides) + totalSlides) % totalSlides);

  // Auto-geser tiap 5 detik, jalan terus tanpa direset walau ada interaksi manual
  useEffect(() => {
    if (totalSlides <= 1) return;
    const timer = setInterval(() => setSlide((s) => (s + 1) % totalSlides), 5000);
    return () => clearInterval(timer);
  }, [totalSlides]);

  const onPointerDown = (e) => { dragRef.current = { x: e.clientX, dragging: true }; };
  const onPointerUp = (e) => {
    if (!dragRef.current.dragging) return;
    const dx = e.clientX - dragRef.current.x;
    if (dx > 45) go(slide - 1);
    else if (dx < -45) go(slide + 1);
    dragRef.current.dragging = false;
  };

  return (
    <div className="relative">
      <div
        className="overflow-hidden select-none touch-pan-y"
        onPointerDown={onPointerDown}
        onPointerUp={onPointerUp}
        onPointerLeave={onPointerUp}
      >
        <div className="flex transition-transform duration-500 ease-out" style={{ transform: `translateX(-${slide * 100}%)` }}>
          {groups.map((group, gi) => (
            <div key={gi} className="w-full shrink-0 grid grid-cols-2 lg:grid-cols-4 gap-4 sm:gap-5">
              {group.map((m, i) => <MaddahCard key={m.id || i} m={m} />)}
            </div>
          ))}
        </div>
      </div>

      {totalSlides > 1 && (
        <>
          <button onClick={() => go(slide - 1)} aria-label="Sebelumnya"
            className="hidden sm:flex absolute top-1/3 -left-4 lg:-left-6 -translate-y-1/2 w-11 h-11 rounded-full bg-white shadow-card items-center justify-center text-sea hover:bg-sea hover:text-white transition-colors z-10">
            <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M15 6l-6 6 6 6"/></svg>
          </button>
          <button onClick={() => go(slide + 1)} aria-label="Berikutnya"
            className="hidden sm:flex absolute top-1/3 -right-4 lg:-right-6 -translate-y-1/2 w-11 h-11 rounded-full bg-white shadow-card items-center justify-center text-sea hover:bg-sea hover:text-white transition-colors z-10">
            <svg viewBox="0 0 24 24" className="w-5 h-5" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>

          <div className="mt-7 flex items-center justify-center gap-2">
            {groups.map((_, gi) => (
              <button key={gi} onClick={() => go(gi)} aria-label={`Ke slide ${gi + 1}`}
                className={`h-2.5 rounded-full transition-all duration-300 ${gi === slide ? "w-7 bg-sun" : "w-2.5 bg-sky/40 hover:bg-sky/60"}`}></button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

/* ================= STATS (count up) ================= */
function useCountUp(target, run) {
  const [val, setVal] = useState(0);
  useEffect(() => {
    if (!run) return;
    let raf; const dur = 1400; const start = performance.now();
    const tick = (now) => {
      const p = Math.min((now - start) / dur, 1);
      const eased = 1 - Math.pow(1 - p, 3);
      setVal(Math.round(target * eased));
      if (p < 1) raf = requestAnimationFrame(tick);
    };
    raf = requestAnimationFrame(tick);
    return () => cancelAnimationFrame(raf);
  }, [run, target]);
  return val;
}
function Stats() {
  const [run, setRun] = useState(false);
  const ref = useRef(null);
  useEffect(() => {
    const io = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setRun(true); io.disconnect(); } }, { threshold: 0.4 });
    if (ref.current) io.observe(ref.current);
    return () => io.disconnect();
  }, []);
  const a = useCountUp(1000, run), b = useCountUp(30, run), c = useCountUp(20, run);
  const fmt = (n) => n.toLocaleString('id-ID');
  const stats = [
    { v: `${fmt(a)}+`, l: "Masisir udah belajar bareng", ic: IcUsers },
    { v: `${b}+`, l: "Muqarrar bisa kamu pilih", ic: IcBook },
    { v: `${c}+`, l: "Pengajar siap bantu kamu", ic: IcCap },
  ];
  return (
    <section ref={ref} className="relative py-11 sm:py-14 overflow-hidden bg-gradient-to-br from-sun via-[#FFA23D] to-[#FFC873]">
      <div className="absolute -top-16 -left-16 w-72 h-72 rounded-full bg-sky/35 blur-3xl"></div>

        <div className="reveal text-center mb-10">
          <h2 className="font-display font-bold text-3xl sm:text-4xl text-white drop-shadow-sm">Kamu nggak sendirian kejar nilai Mumtaz</h2>
          <p className="mt-2 text-white/90">Ribuan Masisir udah lebih tenang hadapi ujian termin bareng Ahlan Akademi 😊.</p>

      {totalSlides > 1 && (
        <>
          <button onClick={() => go(slide - 1)} aria-label="Sebelumnya"
            className="hidden sm:flex absolute top-1/3 -left-4 lg:-left-6 -translate-y-1/2 w-11 h-11 rounded-full bg-white shadow-card items-center justify-center text-sea hover:bg-sea hover:text-white transition-colors z-10">

          </button>
          <button onClick={() => go(slide + 1)} aria-label="Berikutnya"
            className="hidden sm:flex absolute top-1/3 -right-4 lg:-right-6 -translate-y-1/2 w-11 h-11 rounded-full bg-white shadow-card items-center justify-center text-sea hover:bg-sea hover:text-white transition-colors z-10">

          </button>

          <div className="mt-7 flex items-center justify-center gap-2">
            {groups.map((_, gi) => (
              <button key={gi} onClick={() => go(gi)} aria-label={`Ke slide ${gi + 1}`}
                className={`h-2.5 rounded-full transition-all duration-300 ${gi === slide ? "w-7 bg-sun" : "w-2.5 bg-sky/40 hover:bg-sky/60"}`}></button>
            ))}
          </div>
        </>
      )}
    </div>
  );
}

    <div className={`lg:hidden fixed inset-x-0 bottom-0 z-40 p-3 transition-transform duration-300 ${show ? "translate-y-0" : "translate-y-24"}`}>
