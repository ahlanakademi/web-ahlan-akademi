/* ---------- Hook reveal ----------
   Pakai MutationObserver biar elemen .reveal yang baru muncul (misal hasil filter)
   tetap kebagian animasi yang sama kayak halaman lain. */
function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });

    const observeAll = () => document.querySelectorAll('.reveal:not(.in-view)').forEach((el) => io.observe(el));
    observeAll();

    const mo = new MutationObserver(observeAll);
    mo.observe(document.body, { childList: true, subtree: true });

    return () => { io.disconnect(); mo.disconnect(); };
  }, []);
}

const Chip = ({ active, children, onClick }) => (
  <button onClick={onClick}
    className={`shrink-0 text-xs sm:text-[13px] font-semibold rounded-full px-3.5 py-2 border transition-all duration-200 active:scale-95

function FilterGroup({ label, options, value, onChange, format = (v) => v }) {
  return (
    <div>
      <p className="text-[10px] font-bold uppercase tracking-[.12em] text-ink/40 mb-2">{label}</p>
      <div className="chip-row flex gap-2 overflow-x-auto pb-0.5 -mx-1 px-1">
        <Chip active={value === "all"} onClick={() => onChange("all")}>Semua</Chip>
        {options.map((o) => (
          <Chip key={o} active={value === o} onClick={() => onChange(o)}>{format(o)}</Chip>
        ))}
      </div>

function KatalogGrid() {
  const [jurusan, setJurusan] = useState("all");
  const [tingkat, setTingkat] = useState("all");
  const [termin, setTermin] = useState("all");
  const [query, setQuery] = useState("");
  const [sort, setSort] = useState("urutan");

  const uniq = (key) => [...new Set(MADDAH_LIST.map((m) => m[key]))].sort((a, b) => (a > b ? 1 : -1));
  const jurusanOpts = uniq("jurusan");
  const tingkatOpts = uniq("tingkat");
  const terminOpts = uniq("termin");

  const hasil = useMemo(() => {
    const q = query.trim().toLowerCase();
    let list = MADDAH_LIST.filter((m) =>
      (jurusan === "all" || m.jurusan === jurusan) &&
      (tingkat === "all" || m.tingkat === tingkat) &&
      (termin === "all" || m.termin === termin) &&
      (q === "" || m.name.toLowerCase().includes(q) || m.teacher.toLowerCase().includes(q))
    );
    if (sort === "murah") list = [...list].sort((a, b) => a.price - b.price);
    else if (sort === "mahal") list = [...list].sort((a, b) => b.price - a.price);
    else if (sort === "nama") list = [...list].sort((a, b) => a.name.localeCompare(b.name, "id"));
    // "urutan" = urutan asli katalog, nggak diapa-apain
    return list;
  }, [jurusan, tingkat, termin, query, sort]);

  const aktif = [jurusan !== "all", tingkat !== "all", termin !== "all", query.trim() !== ""].filter(Boolean).length;
  const reset = () => { setJurusan("all"); setTingkat("all"); setTermin("all"); setQuery(""); setSort("urutan"); };

  return (
    <section className="pb-4">
      <div className="max-w-6xl mx-auto px-4 sm:px-6">

        {/* Panel filter */}
        <div className="reveal bg-white rounded-3xl border border-sky/20 shadow-soft p-4 sm:p-6">
          <div className="flex flex-col sm:flex-row sm:items-center gap-3">
            <div className="flex items-center gap-2 text-sea">
              <IcSliders className="w-5 h-5" />
              <span className="font-display font-semibold text-base">Saring maddah</span>
            </div>

            <div className="sm:ml-auto flex items-center gap-2 w-full sm:w-auto">
              <div className="relative flex-1 sm:w-64">
                <IcSearch className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-ink/35" />
                <input
                  type="text" value={query} onChange={(e) => setQuery(e.target.value)}
                  placeholder="Cari maddah atau pengajar..."
                  className="w-full rounded-full border border-sky/25 bg-paper/60 pl-10 pr-4 py-2.5 text-sm text-ink placeholder:text-ink/35 focus:outline-none focus:ring-4 focus:ring-sea/15 focus:border-sea/50 transition"
                />
              </div>
              <div className="relative">
                <select value={sort} onChange={(e) => setSort(e.target.value)} aria-label="Urutkan"
                  className="appearance-none rounded-full border border-sky/25 bg-paper/60 pl-4 pr-9 py-2.5 text-sm font-medium text-ink/75 focus:outline-none focus:ring-4 focus:ring-sea/15 focus:border-sea/50 transition cursor-pointer">
                  <option value="urutan">Urutan katalog</option>
                  <option value="murah">Harga terendah</option>
                  <option value="mahal">Harga tertinggi</option>
                  <option value="nama">Nama A–Z</option>
                </select>
                <IcChevron className="w-4 h-4 absolute right-3 top-1/2 -translate-y-1/2 text-ink/40 pointer-events-none" />
              </div>
            </div>
          </div>

          <div className="rule-c my-5"></div>

          <div className="grid sm:grid-cols-3 gap-5">
            <FilterGroup label="Jurusan" options={jurusanOpts} value={jurusan} onChange={setJurusan} />
            <FilterGroup label="Tingkat" options={tingkatOpts} value={tingkat} onChange={setTingkat} format={(v) => "Tingkat " + v} />
            <FilterGroup label="Termin" options={terminOpts} value={termin} onChange={setTermin} format={(v) => "Termin " + v} />
          </div>
        </div>

        {/* Info hasil */}
        <div className="mt-6 flex flex-wrap items-center justify-between gap-3">
          <p className="text-sm text-ink/60">
            Nampilin <b className="text-ink">{hasil.length}</b> dari {MADDAH_LIST.length} maddah
            {aktif > 0 && <span className="text-ink/45"> · {aktif} filter aktif</span>}
          </p>
          {aktif > 0 && (
            <button onClick={reset} className="text-xs font-semibold text-sea hover:text-sun transition-colors underline underline-offset-4">
              Hapus semua filter
            </button>
          )}
        </div>

        {/* Grid kartu */}
        {hasil.length > 0 ? (
          <div className="mt-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-4 sm:gap-5">
            {hasil.map((m, i) => <MaddahCard key={m.id} m={m} index={i} />)}
          </div>
        ) : (
          <div className="mt-5 bg-white rounded-3xl border border-dashed border-sky/40 px-6 py-14 text-center">
            <div className="w-14 h-14 mx-auto rounded-2xl bg-sky/10 flex items-center justify-center text-sea">
              <IcSearch className="w-7 h-7" />
            </div>
            <h3 className="mt-4 font-display font-semibold text-ink text-lg">Belum ada maddah yang cocok</h3>
            <p className="mt-2 text-sm text-ink/60 max-w-sm mx-auto">
              Coba longgarin filternya. Kalau maddah yang kamu cari memang belum ada, kabarin admin — kami catat buat termin berikutnya.
            </p>
            <div className="mt-6 flex flex-col sm:flex-row gap-3 justify-center">
              <button onClick={reset} className="inline-flex items-center justify-center gap-2 rounded-full bg-sea text-white font-semibold text-sm px-6 py-3 hover:brightness-110 transition active:scale-[0.98]">
                Tampilkan semua maddah
              </button>
              <a href={`${WA_URL}?text=${encodeURIComponent("Assalamualaikum, kak, maddah yang aku cari belum ada di katalog. Boleh diusulin?")}`}
                 target="_blank" rel="noopener"
                 className="inline-flex items-center justify-center gap-2 rounded-full border-2 border-sea/40 text-sea font-semibold text-sm px-6 py-3 hover:bg-sea hover:text-white hover:border-sea transition active:scale-[0.98]">
                Usul maddah <IcChat className="w-4 h-4" />
              </a>
            </div>
          </div>
        )}
      </div>
    </section>
  );
}

/* ================= SKEMA DISKON =================
   Ubah harga acuan & besaran diskon di sini. */
const HARGA_NORMAL = 98000;   // harga normal per maddah
const PAKET_OPSI = [
  { n: 1, label: "Normal", rate: 0,    tag: null },
  { n: 3, label: "3 Maddah", rate: 0.05, tag: "Hemat 5%" },
  { n: 5, label: "Bundling", rate: 0.10, tag: "Hemat 10%" },
];

function SkemaDiskon() {
  const [pilih, setPilih] = useState(1); // default: 3 maddah
  const opsi = PAKET_OPSI[pilih];
  const subtotal = HARGA_NORMAL * opsi.n;
  const potongan = Math.round(subtotal * opsi.rate);
  const total = subtotal - potongan;

  const waLink = `${WA_URL}?text=${encodeURIComponent(
    `Assalamualaikum, kak, mau ambil paket ${opsi.label.toLowerCase()}${opsi.rate > 0 ? ` (diskon ${Math.round(opsi.rate * 100)}%)` : ""} dong`
  )}`;

  return (
    <section id="diskon" className="py-10 sm:py-12">
      <div className="max-w-md mx-auto px-4 sm:px-6">
        <div className="reveal bg-white rounded-3xl border border-sky/20 shadow-soft p-5 sm:p-6">
          <div className="flex items-center gap-2">
            <span className="w-8 h-8 rounded-xl bg-sun/10 flex items-center justify-center text-sun shrink-0">
              <IcTag className="w-4 h-4" />
            </span>
            <div>
              <h2 className="font-display font-semibold text-ink text-base sm:text-lg leading-tight">Ambil lebih hemat</h2>
              <p className="text-[11.5px] text-ink/50">Harga normal {idr(HARGA_NORMAL)} / maddah</p>
            </div>
          </div>

          {/* Pilihan paket */}
          <div className="mt-4 grid grid-cols-3 gap-2">
            {PAKET_OPSI.map((o, i) => {
              const aktif = i === pilih;
              return (
                <button key={i} onClick={() => setPilih(i)}
                  className={`rounded-xl px-2 py-2.5 border text-center transition-all duration-200 active:scale-95
                    ${aktif ? "bg-sun border-sun text-white shadow-soft" : "bg-paper border-sky/25 text-ink/70 hover:border-sea/50 hover:text-sea"}`}>
                  <span className="block font-display font-semibold text-[13px]">{o.label}</span>
                  <span className={`block mt-0.5 text-[10px] font-medium ${aktif ? "text-white/85" : "text-ink/40"}`}>
                    {o.tag || "Normal"}
                  </span>
                </button>
              );
            })}
          </div>

          {/* Rincian harga */}
          <div className="mt-4 space-y-2 text-sm">
            <div className="flex items-center justify-between">
              <span className="text-ink/55">Harga normal</span>
              <span className={potongan > 0 ? "text-ink/40 line-through" : "text-ink font-medium"}>{idr(subtotal)}</span>
            </div>
            {potongan > 0 && (
              <div className="flex items-center justify-between">
                <span className="text-ink/55">Diskon {Math.round(opsi.rate * 100)}%</span>
                <span className="text-sea font-semibold">− {idr(potongan)}</span>
              </div>
            )}
            <div className="h-px bg-sky/15"></div>
            <div className="flex items-baseline justify-between pt-0.5">
              <span className="font-display font-semibold text-ink text-sm">Total bayar</span>
              <span className="font-display font-bold text-sun text-xl">{idr(total)}</span>
            </div>
          </div>

          <a href={waLink} target="_blank" rel="noopener"
             className="group mt-4 w-full inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold text-sm px-5 py-3 hover:brightness-105 transition-all active:scale-[0.98]">
            {opsi.rate > 0 ? `Klaim Diskon ${Math.round(opsi.rate * 100)}%` : "Daftar Sekarang"}
            <IcArrow className="w-4 h-4 transition-transform group-hover:translate-x-1" />
          </a>
        </div>
      </div>
    </section>
  );
}
