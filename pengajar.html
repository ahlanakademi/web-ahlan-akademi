/* ---------- Hook reveal ---------- */
function useReveal() {
  useEffect(() => {
    const els = document.querySelectorAll('.reveal');
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.08 });
    els.forEach((el) => io.observe(el));
    return () => io.disconnect();
  }, []);
}

/* ================= NAVIGASI JURUSAN (sticky) ================= */
function JurusanNav() {
  const [active, setActive] = useState("ushuluddin");
  useEffect(() => {
    const ids = ["ushuluddin", "syariah"];
    const onScroll = () => {
      let current = ids[0];
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= 180) current = id;
      });
      setActive(current);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const items = [["ushuluddin", "Ushuluddin"], ["syariah", "Syariah"]];
  return (
    <div className="sticky top-16 z-30 bg-paper/85 backdrop-blur-md border-y border-sky/15">
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-2.5 flex items-center gap-2 overflow-x-auto">
        <span className="hidden sm:inline text-[11px] uppercase tracking-widest text-ink/40 font-semibold mr-1 shrink-0">Jurusan</span>
        {items.map(([id, label]) => (
          <a key={id} href={"#" + id}
             className={`shrink-0 rounded-full px-4 py-1.5 text-sm font-medium transition-all ${
               active === id
                 ? "bg-sun text-white shadow-soft"
                 : "bg-white text-ink/70 border border-sky/25 hover:border-sun hover:text-sun"
             }`}>
            {label}
          </a>
        ))}
      </div>
    </div>
  );
}

/* ================= FOTO PENGAJAR (dengan fallback inisial) ================= */
function TeacherPhoto({ name, photo }) {
  const [broken, setBroken] = useState(false);
  const initials = name.replace(/,.*$/, "").split(" ").filter(Boolean).slice(0, 2).map((w) => w[0]).join("").toUpperCase();
  return (
    <div className="relative w-full h-full bg-gradient-to-br from-sky/35 to-sea/45 flex items-center justify-center">
      <span className="font-display font-bold text-white/80 text-3xl sm:text-4xl tracking-wide">{initials}</span>
      {!broken && (
        <img src={photo} alt={name} loading="lazy" onError={() => setBroken(true)}
             className="absolute inset-0 w-full h-full object-cover object-[center_20%]" />
      )}
      <div className="absolute inset-0 bg-gradient-to-t from-deep/35 via-transparent to-transparent pointer-events-none"></div>
    </div>
  );
}

  const shown = open ? t.experience : t.experience.slice(0, 3);

  return (
    <article className="reveal group relative bg-white rounded-3xl border border-sky/15 shadow-sm hover:shadow-card hover:border-sky/40 transition-all duration-300 overflow-hidden">
      <div className="grid sm:grid-cols-[190px_1fr] lg:grid-cols-[230px_1fr]">

        {/* --- Kolom foto --- */}
        <div className="relative h-60 sm:h-auto sm:min-h-[300px]">
          <TeacherPhoto name={t.name} photo={t.photo} />
          <span className="absolute top-3 left-3 font-display font-bold text-sun text-lg drop-shadow-md">
            {String(index).padStart(2, "0")}
          </span>
        </div>

        {/* --- Kolom konten --- */}
        <div className="p-5 sm:p-6 lg:p-7 flex flex-col">
          <h3 className="font-display font-bold text-ink text-lg sm:text-xl leading-snug">{t.name}</h3>

          {/* Maddah yang diampu */}
          {maddah.length > 0 && (
            <div className="mt-3 flex flex-wrap gap-2">
              {maddah.map((m) => (
                <span key={m.name} className="inline-flex items-center gap-1.5 rounded-full bg-sun/12 text-sun px-3 py-1 text-[11px] sm:text-xs font-semibold">
                  <IcBook className="w-3.5 h-3.5" />
                  {m.name} · Tk. {m.tingkat}
                </span>
              ))}
            </div>
          )}

          <div className="mt-5 h-px bg-sky/15"></div>

          {/* Dua kolom: pendidikan & pengalaman */}
          <div className="mt-5 grid lg:grid-cols-2 gap-5 lg:gap-7 flex-1">
            {/* Pendidikan */}
            <div>
              <p className="flex items-center gap-2 text-[11px] uppercase tracking-widest font-semibold text-sea/80">
                <IcCap className="w-4 h-4" /> Pendidikan
              </p>
              <ul className="mt-3 space-y-2.5">
                {t.education.map((e, i) => (
                  <li key={i} className="flex gap-2.5 text-[13px] sm:text-sm text-ink/75 leading-snug">
                    <span className="shrink-0 mt-[7px] w-1.5 h-1.5 rounded-full bg-sea"></span>
                    <span>{e}</span>
                  </li>
                ))}
              </ul>
            </div>

            {/* Pengalaman */}
            <div className="lg:border-l lg:border-sky/15 lg:pl-7">
              <p className="flex items-center gap-2 text-[11px] uppercase tracking-widest font-semibold text-sun">
                <IcBriefcase className="w-4 h-4" /> Pengalaman Mengajar
              </p>
              <ul className="mt-3 space-y-2.5">
                {shown.map((e, i) => (
                  <li key={i} className="flex gap-2.5 text-[13px] sm:text-sm text-ink/75 leading-snug">
                    <span className="shrink-0 mt-0.5 text-sun"><IcCheck className="w-3.5 h-3.5" stroke={3} /></span>
                    <span>{e}</span>
                  </li>
                ))}
              </ul>
              {hasMore && (
                <button onClick={() => setOpen(!open)}
                        className="mt-3 text-[11px] font-semibold text-sea hover:text-sun transition-colors inline-flex items-center gap-1">
                  {open ? "Tutup" : `+${t.experience.length - 3} pengalaman lainnya`}
                  <IcArrow className={`w-3 h-3 transition-transform ${open ? "-rotate-90" : "rotate-90"}`} />
                </button>
              )}
            </div>
          </div>
        </div>
      </div>
    </article>
  );
}

/* ================= SECTION PER JURUSAN ================= */

      <div className="max-w-6xl mx-auto px-4 sm:px-6">

      </div>
    </section>

}

/* ================= STICKY CTA MOBILE ================= */
function StickyMobileCta() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => setShow(window.scrollY > 560);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div className={`lg:hidden fixed inset-x-0 bottom-0 z-40 p-3 transition-transform duration-300 ${show ? "translate-y-0" : "translate-y-24"}`}>
      <div className="bg-white/95 backdrop-blur-md rounded-2xl shadow-[0_-6px_24px_-8px_rgba(12,94,110,0.35)] border border-sky/20 p-2 flex items-center gap-2">
        <div className="pl-2 leading-tight">
          <p className="text-[11px] text-ink/60">Mulai dari</p>
          <p className="font-display font-bold text-sea text-sm">Rp98.000</p>
        </div>
        <a href={BELAJAR_URL} className="flex-1 inline-flex items-center justify-center gap-2 bg-sun text-white font-semibold rounded-xl py-3 text-sm active:scale-95 transition">
          Daftar Bimbelnya <IcArrow className="w-4 h-4" />
        </a>
      </div>
    </div>
  );
}
