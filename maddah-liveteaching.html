/* ---------- Hook reveal ----------
   Pakai MutationObserver biar elemen .reveal yang baru muncul (misal hasil filter)
   tetap kebagian animasi yang sama kayak halaman lain. */
function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });

    const observeAll = () => document.querySelectorAll('.reveal:not(.in-view)').forEach((el) => io.observe(el));
    observeAll();

    const mo = new MutationObserver(observeAll);
    mo.observe(document.body, { childList: true, subtree: true });

    return () => { io.disconnect(); mo.disconnect(); };
  }, []);
}

/* ==========================================================================
   AMBIL DATA 1 MADDAH BERDASARKAN ?id= DI URL
   ========================================================================== */
function useMaddahDetail() {
  const [maddah, setMaddah] = useState(null);
  const [memuat, setMemuat] = useState(true);
  const [galat, setGalat] = useState("");

  useEffect(() => {
    let batal = false;
    const id = new URLSearchParams(window.location.search).get("id");

    (async () => {
      setMemuat(true); setGalat("");

      /* MODE DEMO — selama Supabase belum disambungkan */
      if (!SB_AKTIF) {
        setTimeout(() => {
          if (batal) return;
          setMaddah(MADDAH_DEMO_DETAIL);
          setMemuat(false);
        }, 400);
        return;
      }

      if (!id) { setGalat("Maddah tidak ditemukan."); setMemuat(false); return; }

      try {
        const { data: row, error: e1 } = await sb.from("maddah").select("*").eq("id", id).single();
        if (e1 || !row) { if (!batal) { setGalat("Maddah tidak ditemukan."); setMemuat(false); } return; }

        if (batal) return;
        setMaddah(row);
      } catch (e) {
        console.error(e);
        if (!batal) setGalat("Gagal memuat data maddah. Muat ulang halaman ya.");
      } finally {
        if (!batal) setMemuat(false);
      }
    })();

    return () => { batal = true; };
  }, []);

  return { maddah, memuat, galat };
}

/* ==========================================================================

  const pendidikan = (maddah.pengajar_pendidikan || "")
    .split("\n")
    .map((s) => s.trim())
    .filter(Boolean);
  
  const pengalaman = (maddah.pengajar_pengalaman || "")
    .split("\n")
    .map((s) => s.trim())
    .filter(Boolean);

  return (
    <div className="reveal bg-white rounded-3xl border border-sky/18 shadow-soft p-6 sm:p-8 h-full flex flex-col">

        <div className="shrink-0 w-20 h-20 sm:w-24 sm:h-24 rounded-2xl overflow-hidden bg-sky/15 grid place-items-center">
          {maddah.pengajar_foto ? (
            <img src={maddah.pengajar_foto} alt={maddah.pengajar} className="w-full h-full object-cover" />

            <IcUsers className="w-9 h-9 text-sea/50" />
          )}

        <div className="min-w-0">
          <p className="text-[11px] font-semibold uppercase tracking-wide text-sea">Pengajar Maddah Ini</p>
          <h3 className="font-display font-bold text-deep text-lg sm:text-xl mt-0.5">{maddah.pengajar || "Segera diumumkan"}</h3>

      </div>

      {pendidikan.length > 0 && (
        <div className="mt-5 pt-5 border-t border-sky/12">
          <p className="text-xs font-semibold uppercase tracking-wide text-sea">Pendidikan</p>
          <ul className="mt-2.5 space-y-2">
            {pendidikan.map((p, i) => (
              <li key={i} className="flex items-start gap-2.5 text-sm text-ink/65 leading-snug">
                <span className="shrink-0 mt-1.5 w-1.5 h-1.5 rounded-full bg-sea/50" />
                <span>{p}</span>

            ))}

        </div>
      )}

      {pengalaman.length > 0 && (
        <div className={`${pendidikan.length > 0 ? "mt-4 pt-4 border-t border-sky/12" : "mt-5 pt-5 border-t border-sky/12"}`}>
          <p className="text-xs font-semibold uppercase tracking-wide text-sea">Pengalaman</p>
          <ul className="mt-2.5 space-y-2">
            {pengalaman.map((p, i) => (

/* ==========================================================================
   TESTIMONI — cuma review bintang 5 yang boleh publik, sebelum checkout
   ========================================================================== */
function Testimoni({ maddahId }) {
  const [daftar, setDaftar] = useState([]);
  const [memuat, setMemuat] = useState(true);

  useEffect(() => {
    if (!SB_AKTIF || !maddahId) { setMemuat(false); return; }
    let batal = false;
    (async () => {
      try {
        const { data } = await sb.rpc("maddah_testimoni", { p_maddah_id: maddahId });
        if (!batal) setDaftar(data || []);
      } catch (e) {
        console.error(e);
      } finally {
        if (!batal) setMemuat(false);
      }
    })();
    return () => { batal = true; };
  }, [maddahId]);

  if (memuat || daftar.length === 0) return null;   // belum ada testimoni bintang 5 — sembunyikan section

  return (
    <section className="mt-14">
      <span className="tab-label">Kata Mereka</span>
      <h2 className="font-display font-bold text-xl sm:text-2xl text-deep mt-3">Testimoni Siswa</h2>
      <div className="mt-5 grid sm:grid-cols-2 gap-4">
        {daftar.map((t, i) => (
          <div key={i} className="reveal bg-white rounded-3xl border border-sky/18 shadow-soft p-5">
            <div className="flex items-center gap-1 text-sun">
              {[1, 2, 3, 4, 5].map((n) => (
                <svg key={n} viewBox="0 0 20 20" className="w-4 h-4" fill="currentColor"><path d="M10 1.5l2.6 5.6 6 .7-4.4 4.1 1.2 6-5.4-3-5.4 3 1.2-6-4.4-4.1 6-.7z" /></svg>
              ))}
            </div>
            <p className="text-sm text-ink/70 mt-3 leading-relaxed">"{t.komentar}"</p>
            <p className="text-xs font-semibold text-deep mt-3">{t.nama_depan}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

/* ==========================================================================
   POP-UP "BARU SAJA DAFTAR" — social proof, cuma nama depan, tanpa data lain
   ========================================================================== */

function PopupPembeli({ maddahId, namaMaddah }) {
  const [daftar, setDaftar] = useState([]);
  const [idx, setIdx] = useState(0);
  const [tampil, setTampil] = useState(false);

  /* Ambil daftar pembeli sekali saat halaman dibuka */
  useEffect(() => {
    if (!SB_AKTIF || !maddahId) return;
    let batal = false;
    (async () => {
      try {
        const { data } = await sb.rpc("maddah_pembeli", { p_maddah_id: maddahId });
        if (!batal && data) setDaftar(data);
      } catch (e) {
        console.error(e);
      }
    })();
    return () => { batal = true; };
  }, [maddahId]);

  /* Muncul-hilang bergantian tiap beberapa detik, ganti nama tiap putaran */
  useEffect(() => {
    if (daftar.length === 0) return;
    let mounted = true;
    const munculkan = () => {
      if (!mounted) return;
      setTampil(true);
      setTimeout(() => { if (mounted) setTampil(false); }, 4500);
    };
    const t1 = setTimeout(munculkan, 2500); // kemunculan pertama
    const interval = setInterval(() => {
      setIdx((i) => (i + 1) % daftar.length);
      munculkan();
    }, 8000);
    return () => { mounted = false; clearTimeout(t1); clearInterval(interval); };
  }, [daftar]);

  if (daftar.length === 0) return null;
  const p = daftar[idx];

  return (
    <div className={`fixed left-3 bottom-20 sm:left-5 lg:bottom-5 z-30 transition-all duration-500 ${tampil ? "opacity-100 translate-y-0" : "opacity-0 translate-y-3 pointer-events-none"}`}>
      <div className="bg-white rounded-2xl shadow-card border border-sky/18 pl-3.5 pr-4 py-3 flex items-center gap-3 max-w-[280px]">
        <span className="shrink-0 w-9 h-9 rounded-full bg-sea/10 text-sea grid place-items-center">
          <IcUsers className="w-4 h-4" />
        </span>
        <p className="text-xs text-ink/70 leading-snug">
          <span className="font-semibold text-deep">{p.nama_depan}</span> baru saja daftar
          <span className="block text-[10px] text-ink/45 mt-0.5">{namaMaddah}</span>
        </p>
      </div>
    </div>
  );
}
