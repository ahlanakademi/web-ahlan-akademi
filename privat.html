/* ---------- Hook reveal ---------- */
function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    const observeAll = () => document.querySelectorAll('.reveal:not(.in-view)').forEach((el) => io.observe(el));
    observeAll();
    const mo = new MutationObserver(observeAll);
    mo.observe(document.body, { childList: true, subtree: true });
    return () => { io.disconnect(); mo.disconnect(); };
  }, []);
}

/* ================= STICKY CTA MOBILE ================= */
function StickyMobileCta() {
  const [show, setShow] = useState(false);
  useEffect(() => {
    const onScroll = () => setShow(window.scrollY > 560);
    window.addEventListener('scroll', onScroll);
    return () => window.removeEventListener('scroll', onScroll);
  }, []);
  return (
    <div className={`lg:hidden fixed inset-x-0 bottom-0 z-40 p-3 transition-transform duration-300 ${show ? "translate-y-0" : "translate-y-24"}`}>
      <div className="bg-[#0D1E3E]/95 backdrop-blur-md rounded-2xl shadow-[0_-6px_24px_-8px_rgba(0,0,0,.7)] border border-[#D3B072]/30 p-2 flex items-center gap-2">
        <div className="pl-2 leading-tight">

          <p className="font-display font-bold text-gold2 text-sm">Rp350.000</p>

           className="flex-1 inline-flex items-center justify-center gap-2 bg-gradient-to-r from-[#F1DDAE] to-[#C79C4F] text-[#0A1730] font-semibold rounded-xl py-3 text-sm active:scale-95 transition">
          Daftar Kelas Privat <IcArrow className="w-4 h-4" />
        </a>
      </div>
    </div>
  );
}
