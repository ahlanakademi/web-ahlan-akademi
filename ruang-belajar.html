const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);

/* Penyimpanan progres — dibungkus try/catch supaya aman di semua lingkungan.
   Kalau nanti sudah ada backend, cukup ganti isi get/set ini dengan panggilan API. */
const memoryStore = {};
const store = {
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem("ahlan:" + key);
      if (raw != null) return JSON.parse(raw);
    } catch (e) { /* diabaikan */ }
    return key in memoryStore ? memoryStore[key] : fallback;
  },
  set(key, val) {
    memoryStore[key] = val;
    try { window.localStorage.setItem("ahlan:" + key, JSON.stringify(val)); } catch (e) { /* diabaikan */ }
  },
};

/* 3720 (detik) -> "62:00" ; kalau null/0 dikembalikan string kosong */
const formatDurasi = (detik) => {
  if (!detik) return "";
  const m = Math.floor(detik / 60), d = detik % 60;
  return `${m}:${String(d).padStart(2, "0")}`;
};

/* Ubah 1 baris tabel `maddah` + episode + materi jadi bentuk yang dipakai UI */
const bentukMaddah = (row, episodes, materials) => ({
  id:        row.id,
  name:      row.nama,
  teacher:   row.pengajar || "",
  jurusan:   row.jurusan || "",
  tingkat:   row.tingkat || "",
  termin:    row.termin || "",
  tahun:     row.tahun ? String(row.tahun) : "",
  cover:     row.cover_url || "",
  playlist:  row.playlist_id || "",
  grupUrl:   row.grup_url || "",
  rangkuman: materials.map((m) => ({
    label: m.label,
    file:  m.file_path,            // path di bucket privat, bukan link langsung
    lang:  (m.bahasa || "id").toUpperCase() === "AR" ? "AR" : "ID",
    note:  m.bahasa === "ar"
             ? "Teks Arab asli, cocok buat latihan istilah ujian."
             : "Ringkasan lengkap muqarrar, siap dibaca H-1 ujian.",
  })),
  episodes: episodes.map((e) => ({
    title: e.judul,
    dur:   formatDurasi(e.durasi),
  })),
});

async function ambilMaddahSiswa(userId) {
  /* a. maddah apa saja yang enrollment-nya aktif */
  const { data: enrol, error: e1 } = await sb
    .from("enrollments")
    .select("maddah_id, maddah(*)")
    .eq("user_id", userId)
    .eq("status", "active");
  if (e1) throw e1;
  if (!enrol || enrol.length === 0) return [];

  const ids = enrol.map((r) => r.maddah_id);

  /* b. semua episode & materi untuk maddah tersebut (sekali query, bukan per-maddah) */
  const [{ data: eps, error: e2 }, { data: mats, error: e3 }] = await Promise.all([
    sb.from("episodes").select("*").in("maddah_id", ids).order("urutan"),
    sb.from("materials").select("*").in("maddah_id", ids),
  ]);
  if (e2) throw e2;
  if (e3) throw e3;

  return enrol
    .filter((r) => r.maddah)
    .map((r) => bentukMaddah(
      r.maddah,
      (eps || []).filter((e) => e.maddah_id === r.maddah_id),
      (mats || []).filter((m) => m.maddah_id === r.maddah_id),
    ));
}

/* PDF ada di bucket PRIVAT, jadi tautannya dibuat sesaat (berlaku 60 detik).
   Tanpa ini, file cuma bisa dibuka lewat dashboard Supabase. */
async function unduhMateri(filePath) {
  if (!SB_AKTIF) { window.open(filePath, "_blank"); return; }
  const { data, error } = await sb.storage
    .from(BUCKET_MATERI)
    .createSignedUrl(filePath, 60);
  if (error || !data) { alert("Gagal membuka file. Coba lagi sebentar lagi ya."); return; }
  window.open(data.signedUrl, "_blank");
}

const firstNameOf = (user) => {
  if (!user) return "Thalib";
  if (user.name) return user.name.trim().split(/\s+/)[0];
  const raw = (user.email || "").split("@")[0].replace(/[._-]+/g, " ").trim();
  if (!raw) return "Thalib";
  return raw.split(" ")[0].replace(/^./, (c) => c.toUpperCase());
};

  if (score >= 85) return "Mumtaz";

  if (score >= 65) return "Jayyid";
  return "Maqbul";
};

function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    const observeAll = () => document.querySelectorAll('.reveal:not(.in-view)').forEach((el) => io.observe(el));
    observeAll();
    const mo = new MutationObserver(observeAll);
    mo.observe(document.body, { childList: true, subtree: true });
    return () => { io.disconnect(); mo.disconnect(); };
  }, []);
}

/* Cover maddah dengan fallback kalau file gambar belum ada */
function Cover({ src, name, className = "" }) {
  const [err, setErr] = useState(false);
  if (err || !src) {
    return (
      <div className={`relative overflow-hidden bg-gradient-to-br from-sky/30 to-sand flex items-center justify-center ${className}`}>
        <IcBook className="w-10 h-10 text-sea/40" />
      </div>
    );
  }
  return <img src={src} alt={name} onError={() => setErr(true)} className={`object-cover ${className}`} />;
}

/* Modal serba guna */
function Modal({ open, onClose, children, size = "md", labelledBy }) {
  useEffect(() => {
    if (!open) return;
    document.body.classList.add("modal-open");
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => { document.body.classList.remove("modal-open"); window.removeEventListener("keydown", onKey); };
  }, [open, onClose]);
  if (!open) return null;
  const w = size === "lg" ? "max-w-3xl" : size === "xl" ? "max-w-5xl" : "max-w-lg";
  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 fade-in" role="dialog" aria-modal="true" aria-labelledby={labelledBy}>
      <div className="absolute inset-0 bg-ink/60 backdrop-blur-sm" onClick={onClose} />
      <div className={`relative w-full ${w} bg-white rounded-t-3xl sm:rounded-3xl shadow-card max-h-[92vh] overflow-y-auto nice-scroll pop-in`}>
        {children}
      </div>
    </div>
  );
}

/* ==========================================================================

function LoginGate({ onLogin }) {
  const [loading, setLoading] = useState(false);
  const [pesan, setPesan] = useState("");

  const masuk = async () => {
    setLoading(true); setPesan("");

    /* MODE DEMO — selama SUPABASE_URL & ANON_KEY masih kosong.
       Berguna buat cek tampilan tanpa perlu database. */
    if (!SB_AKTIF) {
      setTimeout(() => onLogin({ name: "Rama Adhitia", email: "rama.adhitia@gmail.com" }), 700);
      return;
    }

    /* MODE ASLI — Supabase yang mengurus seluruh proses OAuth Google.
       Setelah siswa menekan tombol, browser pindah ke halaman Google,
       lalu kembali lagi ke halaman ini dengan sesi yang sudah aktif. */
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: window.location.origin + window.location.pathname },
    });

    if (error) {
      setLoading(false);
      setPesan("Gagal menghubungkan ke Google. Coba lagi sebentar lagi ya.");
    }
  };
  return (
    <main className="min-h-screen grid place-items-center px-4 py-24 relative overflow-hidden">
      <div className="absolute inset-0 bg-gradient-to-b from-paper via-paper to-sky/10" aria-hidden="true"></div>

        <span className="tab-label mt-6 inline-block">Ruang Belajar</span>
        <h1 className="font-display font-bold text-2xl sm:text-3xl text-deep mt-4">Ahlan wa Sahlan 👋</h1>
        <p className="text-ink/65 text-sm mt-2 leading-relaxed">
          Masuk pakai akun Google yang kamu gunakan waktu daftar bimbel, biar semua maddah yang sudah kamu beli langsung muncul.
        </p>

        <button onClick={masuk} disabled={loading}
          className="mt-7 w-full inline-flex items-center justify-center gap-3 rounded-full bg-white border-2 border-sky/30 py-3.5 font-semibold text-ink hover:border-sea hover:shadow-soft active:scale-[.98] transition disabled:opacity-60">
          {loading ? (
            <><span className="w-5 h-5 rounded-full border-2 border-sea/30 border-t-sea animate-spin" /> Menghubungkan…</>
          ) : (
            <><IcGoogle /> Masuk dengan Google</>
          )}

        {pesan && (
          <p className="mt-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-2.5">{pesan}</p>

          Ada kendala masuk? <a href={`${WA_URL}?text=${encodeURIComponent(WA_TEKNIS)}`} target="_blank" rel="noopener" className="text-sea font-semibold hover:underline">Chat admin</a>.
        </p>
      </div>
    </main>
  );
}

              Ahlan wa Sahlan, {firstNameOf(user)}! 👋

              Kalau kamu baru saja menyelesaikan pembayaran, tunggu beberapa saat lalu muat ulang halaman —
              atau pastikan email pembayaranmu sama dengan email Google yang kamu pakai masuk sekarang
              (<b className="text-ink/75">{user.email}</b>).

            <div className="mt-7 flex flex-col sm:flex-row gap-3 justify-center">

                Chat Admin

            </div>

  return (

/* ==========================================================================
   PEMUTAR VIDEO (YouTube IFrame API + fallback iframe biasa)
   ========================================================================== */
let ytApiPromise = null;
function loadYTApi() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve, reject) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (typeof prev === "function") prev(); resolve(window.YT); };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = reject;
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) reject(new Error("timeout")); }, 9000);
  });
  return ytApiPromise;
}

function VideoPlayer({ playlistId, index, onEnded, onIndexChange }) {
  const wrapRef = useRef(null);
  const playerRef = useRef(null);
  const [ready, setReady] = useState(false);
  const [failed, setFailed] = useState(false);
  const cbEnded = useRef(onEnded);
  const cbIndex = useRef(onIndexChange);
  cbEnded.current = onEnded;
  cbIndex.current = onIndexChange;

  useEffect(() => {
    let alive = true;
    setReady(false); setFailed(false);
    loadYTApi().then((YT) => {
      if (!alive || !wrapRef.current) return;
      wrapRef.current.innerHTML = "";
      const host = document.createElement("div");
      host.style.width = "100%"; host.style.height = "100%";
      wrapRef.current.appendChild(host);
      playerRef.current = new YT.Player(host, {
        width: "100%", height: "100%",
        playerVars: {
          listType: "playlist", list: playlistId,
          rel: 0, modestbranding: 1, playsinline: 1,
        },
        events: {
          onReady: (e) => {
            if (!alive) return;
            setReady(true);
            try { e.target.cuePlaylist({ listType: "playlist", list: playlistId, index: index }); } catch (err) {}
          },
          onStateChange: (e) => {
            if (!alive) return;
            if (e.data === window.YT.PlayerState.ENDED && cbEnded.current) cbEnded.current();
            if (e.data === window.YT.PlayerState.PLAYING && cbIndex.current) {
              try {
                const i = e.target.getPlaylistIndex();
                if (typeof i === "number" && i >= 0) cbIndex.current(i);
              } catch (err) {}
            }
          },
          onError: () => {},
        },
      });
    }).catch(() => { if (alive) setFailed(true); });
    return () => {
      alive = false;
      try { if (playerRef.current && playerRef.current.destroy) playerRef.current.destroy(); } catch (e) {}
      playerRef.current = null;
      if (wrapRef.current) wrapRef.current.innerHTML = "";
    };
  }, [playlistId]);

  // Pindah episode saat pengguna klik daftar di samping
  useEffect(() => {
    if (!ready || !playerRef.current) return;
    try {
      if (playerRef.current.getPlaylistIndex() !== index) playerRef.current.playVideoAt(index);
    } catch (e) {}
  }, [index, ready]);

  if (failed) {
    return (
      <iframe
        className="absolute inset-0 w-full h-full"
        src={`https://www.youtube-nocookie.com/embed/videoseries?list=${playlistId}&index=${index + 1}&rel=0&modestbranding=1`}
        title="Video pembelajaran"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        allowFullScreen
      />
    );
  }

  return (
    <>
      <div ref={wrapRef} className="absolute inset-0 w-full h-full" />
      {!ready && (
        <div className="absolute inset-0 grid place-items-center bg-deep text-white/70">
          <div className="text-center">
            <span className="block w-9 h-9 mx-auto rounded-full border-2 border-white/25 border-t-white animate-spin" />
            <p className="text-xs mt-3">Menyiapkan video…</p>
          </div>
        </div>
      )}
    </>
  );
}

                  <span className="w-8 h-8 rounded-full bg-sun text-white grid place-items-center font-display font-bold text-sm">{i + 1}</span>
                  <p className="font-semibold text-deep text-sm mt-2.5">{t}</p>
                  <p className="text-xs text-ink/60 mt-1 leading-relaxed">{d}</p>
                </li>
              ))}
            </ol>
          </div>
        </section>
      </div>
    </main>
  );
}

/* ==========================================================================
   MODAL KUIS DIGITAL
   ========================================================================== */
function QuizModal({ open, onClose, maddah, onFinish }) {
  const soal = (maddah && QUIZ_BANK[maddah.id]) || [];
  const [i, setI] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [picked, setPicked] = useState(null);
  const [selesai, setSelesai] = useState(false);

  useEffect(() => { if (open) { setI(0); setAnswers([]); setPicked(null); setSelesai(false); } }, [open, maddah]);
  if (!open || !maddah || soal.length === 0) return null;

  const benar = answers.filter((a, k) => a === soal[k].a).length;
  const score = Math.round((benar / soal.length) * 100);

  const pilih = (k) => { if (picked !== null) return; setPicked(k); setAnswers((prev) => [...prev, k]); };
  const lanjut = () => {
    if (i + 1 < soal.length) { setI(i + 1); setPicked(null); }
    else {
      const b = [...answers].filter((a, k) => a === soal[k].a).length;
      const s = Math.round((b / soal.length) * 100);
      setSelesai(true);
      onFinish({ score: s, benar: b, total: soal.length, predikat: predikatOf(s) });
    }
  };
  const ulangi = () => { setI(0); setAnswers([]); setPicked(null); setSelesai(false); };

  const q = soal[i];

  return (
    <Modal open={open} onClose={onClose} size="lg" labelledBy="quiz-title">
      <ModalHead id="quiz-title" title="Kuis Digital" subtitle={`${maddah.name} — ${maddah.jurusan} Tk. ${maddah.tingkat}, Termin ${maddah.termin}`} onClose={onClose} />

      {!selesai ? (
        <div className="p-5 sm:p-7">
          <div className="flex items-center justify-between text-xs font-semibold text-ink/55">
            <span>Soal {i + 1} dari {soal.length}</span>
            <span>{answers.length > 0 ? `${answers.filter((a, k) => a === soal[k].a).length} benar` : "Semangat!"}</span>
          </div>
          <ProgressBar value={pct(i, soal.length)} className="mt-2" tone="sea" />

          <h4 className="font-display font-bold text-lg sm:text-xl text-deep mt-6 leading-snug">{q.q}</h4>

          <div className="mt-4 grid gap-2.5">
            {q.opts.map((o, k) => {
              const isRight = k === q.a;
              const chosen = picked === k;
              let cls = "border-sky/25 hover:border-sea hover:bg-sky/8";
              if (picked !== null) {
                if (isRight) cls = "border-emerald-400 bg-emerald-50";
                else if (chosen) cls = "border-red-300 bg-red-50";
                else cls = "border-sky/15 opacity-55";
              }
              return (
                <button key={k} onClick={() => pilih(k)} disabled={picked !== null}
                  className={`w-full text-left rounded-2xl border-2 px-4 py-3.5 transition flex items-start gap-3 ${cls}`}>
                  <span className={`shrink-0 w-7 h-7 rounded-full grid place-items-center text-xs font-bold mt-0.5
                    ${picked !== null && isRight ? "bg-emerald-500 text-white" : picked !== null && chosen ? "bg-red-400 text-white" : "bg-sky/15 text-sea"}`}>
                    {String.fromCharCode(65 + k)}
                  </span>
                  <span className="text-sm text-ink/85 leading-relaxed flex-1">{o}</span>
                </button>
              );
            })}
          </div>

          {picked !== null && (
            <div className={`mt-4 rounded-2xl p-4 pop-in ${picked === q.a ? "bg-emerald-50 border border-emerald-200" : "bg-amber-50 border border-amber-200"}`}>
              <p className={`font-semibold text-sm ${picked === q.a ? "text-emerald-700" : "text-amber-700"}`}>
                {picked === q.a ? "Ahsant! Jawabanmu benar." : "Belum tepat. Jawaban yang benar: " + String.fromCharCode(65 + q.a) + "."}
              </p>
              <p className="text-sm text-ink/70 mt-1.5 leading-relaxed">{q.exp}</p>
            </div>
          )}

          <div className="mt-6 flex justify-end">
            <button onClick={lanjut} disabled={picked === null}
              className="inline-flex items-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3 text-sm shadow-soft hover:brightness-105 active:scale-[.98] transition disabled:opacity-40">
              {i + 1 < soal.length ? "Soal Berikutnya" : "Lihat Hasil"} <IcArrow className="w-4 h-4" />
            </button>
          </div>
        </div>
      ) : (
        <div className="p-6 sm:p-9 text-center">
          <div className="w-24 h-24 mx-auto rounded-full grid place-items-center bg-gradient-to-br from-sea to-deep text-white shadow-card">
            <div>
              <p className="font-display font-bold text-2xl leading-none">{score}%</p>
              <p className="text-[10px] text-white/70 mt-0.5">Nilai</p>
            </div>
          </div>
          <h4 className="font-display font-bold text-2xl text-deep mt-5">{predikatOf(score)}</h4>
          <p className="text-ink/65 text-sm mt-1.5">
            {benar} dari {soal.length} soal terjawab benar.
            {score >= 75 ? " Mantap, pemahamanmu sudah solid!" : " Ulangi videonya sebentar, lalu coba kuis lagi ya."}
          </p>

          <div className="mt-6 text-left rounded-2xl border border-sky/18 divide-y divide-sky/12 max-h-64 overflow-y-auto nice-scroll">
            {soal.map((s, k) => {
              const ok = answers[k] === s.a;
              return (
                <div key={k} className="p-3.5 flex items-start gap-3">
                  <span className={`shrink-0 w-6 h-6 rounded-full grid place-items-center text-white mt-0.5 ${ok ? "bg-emerald-500" : "bg-red-400"}`}>
                    {ok ? <IcCheck className="w-3.5 h-3.5" stroke={3} /> : <IcClose className="w-3.5 h-3.5" />}
                  </span>
                  <div className="min-w-0">
                    <p className="text-sm font-medium text-ink/85 leading-snug">{k + 1}. {s.q}</p>
                    {!ok && <p className="text-xs text-ink/55 mt-1">Jawaban benar: <b className="text-sea">{s.opts[s.a]}</b></p>}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="mt-6 flex flex-col sm:flex-row gap-2.5 justify-center">
            <button onClick={ulangi} className="inline-flex items-center justify-center gap-2 rounded-full border-2 border-sky/30 text-sea font-semibold px-6 py-3 text-sm hover:border-sea transition">
              Ulangi Kuis
            </button>
            <button onClick={onClose} className="inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3 text-sm shadow-soft hover:brightness-105 transition">
              Selesai <IcCheck className="w-4 h-4" stroke={3} />
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ==========================================================================
   MODAL FLASHCARD (kartu hafalan)
   ========================================================================== */
function FlashcardModal({ open, onClose, maddah, memorized, onChange }) {
  const deck = (maddah && FLASHCARD_BANK[maddah.id]) || [];
  const tags = useMemo(() => ["Semua"].concat(Array.from(new Set(deck.map((c) => c.tag)))), [maddah]);

  const [tag, setTag] = useState("Semua");
  const [onlyNew, setOnlyNew] = useState(false);
  const [order, setOrder] = useState([]);
  const [pos, setPos] = useState(0);
  const [flipped, setFlipped] = useState(false);

  const build = useCallback((t, only, shuffle) => {
    let idx = deck.map((c, i) => i).filter((i) => t === "Semua" || deck[i].tag === t);
    if (only) idx = idx.filter((i) => memorized.indexOf(i) === -1);
    if (shuffle) {
      for (let i = idx.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        const tmp = idx[i]; idx[i] = idx[j]; idx[j] = tmp;
      }
    }
    setOrder(idx); setPos(0); setFlipped(false);
  }, [maddah, memorized]);

  useEffect(() => {
    if (!open) return;
    setTag("Semua"); setOnlyNew(false);
    let idx = deck.map((c, i) => i);
    setOrder(idx); setPos(0); setFlipped(false);
  }, [open, maddah]);

  const selesai = order.length > 0 && pos >= order.length;
  const cardIdx = !selesai && order.length ? order[pos] : -1;
  const card = cardIdx >= 0 ? deck[cardIdx] : null;
  const hafal = cardIdx >= 0 && memorized.indexOf(cardIdx) !== -1;

  const next = () => { setFlipped(false); setTimeout(() => setPos((p) => p + 1), 120); };
  const prev = () => { if (pos > 0) { setFlipped(false); setTimeout(() => setPos((p) => p - 1), 120); } };
  const tandaiHafal = () => {
    if (cardIdx < 0) return;
    if (memorized.indexOf(cardIdx) === -1) onChange(memorized.concat([cardIdx]));
    next();
  };
  const ulangiNanti = () => {
    if (cardIdx < 0) return;
    onChange(memorized.filter((i) => i !== cardIdx));
    setOrder((o) => o.concat([cardIdx]));
    next();
  };

  useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      if (e.key === " " || e.key === "Enter") { e.preventDefault(); setFlipped((f) => !f); }
      else if (e.key === "ArrowRight") next();
      else if (e.key === "ArrowLeft") prev();
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, pos, order.length]);

  if (!open || !maddah) return null;

  const totalHafal = memorized.length;
  const persen = pct(totalHafal, deck.length);

  if (deck.length === 0) {
    return (
      <Modal open={open} onClose={onClose} size="lg" labelledBy="fc-title">
        <ModalHead id="fc-title" title="Flashcard Hafalan" subtitle={maddah.name} onClose={onClose} />
        <div className="p-10 text-center">
          <IcCards className="w-10 h-10 text-sea/50 mx-auto" />
          <p className="font-semibold text-deep mt-3">Flashcard sedang disiapkan</p>
          <p className="text-sm text-ink/55 mt-1">Kartu hafalan untuk maddah ini akan segera hadir, insyaAllah.</p>
        </div>
      </Modal>
    );
  }

  return (
    <Modal open={open} onClose={onClose} size="lg" labelledBy="fc-title">
      <ModalHead id="fc-title" title="Flashcard Hafalan"
                 subtitle={`${maddah.name} — ${deck.length} kartu istilah kunci`} onClose={onClose} />

      <div className="p-5 sm:p-7">
        {/* Progres hafalan */}
        <div className="flex items-center justify-between text-xs font-semibold text-ink/60">
          <span>{totalHafal} dari {deck.length} kartu sudah hafal</span>
          <span className="text-sea">{persen}%</span>
        </div>
        <ProgressBar value={persen} className="mt-2" tone="sea" />

        {/* Filter kategori */}
        <div className="mt-4 flex items-center gap-2 overflow-x-auto chip-row pb-1">
          {tags.map((t) => (
            <button key={t} onClick={() => { setTag(t); build(t, onlyNew, false); }}
              className={`shrink-0 px-3.5 py-1.5 rounded-full text-xs font-semibold border transition
                ${tag === t ? "bg-sea text-white border-sea" : "border-sky/30 text-ink/65 hover:border-sea hover:text-sea"}`}>
              {t}
            </button>
          ))}
        </div>

        <div className="mt-3 flex flex-wrap items-center gap-2">
          <button onClick={() => { const v = !onlyNew; setOnlyNew(v); build(tag, v, false); }}
            className={`inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border transition
              ${onlyNew ? "bg-sun text-white border-sun" : "border-sky/30 text-ink/65 hover:border-sun hover:text-sun"}`}>
            <IcCheck className="w-3.5 h-3.5" stroke={3} /> Fokus yang belum hafal
          </button>
          <button onClick={() => build(tag, onlyNew, true)}
            className="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full text-xs font-semibold border border-sky/30 text-ink/65 hover:border-sea hover:text-sea transition">
            <IcShuffle className="w-3.5 h-3.5" /> Acak urutan
          </button>
          <span className="flex-1" />
          {!selesai && order.length > 0 && (
            <span className="text-xs font-semibold text-ink/45">Kartu {pos + 1} / {order.length}</span>
          )}
        </div>

        {/* Kartu */}
        {order.length === 0 ? (
          <div className="mt-6 rounded-3xl border-2 border-dashed border-sky/30 p-10 text-center">
            <IcCheck className="w-9 h-9 text-emerald-500 mx-auto" stroke={3} />
            <p className="font-display font-bold text-deep mt-3">Semua kartu di kategori ini sudah hafal!</p>
            <p className="text-sm text-ink/55 mt-1">Coba kategori lain, atau matikan filter "fokus yang belum hafal".</p>
          </div>
        ) : selesai ? (
          <div className="mt-6 rounded-3xl bg-gradient-to-br from-sand via-sand/70 to-sky/15 border border-sun/20 p-8 sm:p-10 text-center">
            <span className="w-16 h-16 rounded-full bg-sun text-white grid place-items-center mx-auto"><IcCards className="w-8 h-8" /></span>
            <h4 className="font-display font-bold text-xl text-deep mt-4">Selesai satu putaran!</h4>
            <p className="text-sm text-ink/65 mt-2 max-w-sm mx-auto leading-relaxed">
              Kamu sudah hafal {totalHafal} dari {deck.length} kartu di maddah ini. Ulangi lagi besok biar makin lengket di ingatan.
            </p>
            <div className="mt-6 flex flex-col sm:flex-row gap-2.5 justify-center">
              <button onClick={() => build(tag, true, true)}
                className="inline-flex items-center justify-center gap-2 rounded-full border-2 border-sky/30 text-sea font-semibold px-6 py-3 text-sm hover:border-sea transition">
                <IcRefresh className="w-4 h-4" /> Ulangi yang belum hafal
              </button>
              <button onClick={() => build(tag, false, true)}
                className="inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3 text-sm shadow-soft hover:brightness-105 transition">
                <IcShuffle className="w-4 h-4" /> Ulangi semua kartu
              </button>
            </div>
          </div>
        ) : (
          <>
            <div className="mt-5 flip-card h-[290px] sm:h-[330px] cursor-pointer select-none"
                 onClick={() => setFlipped(!flipped)} role="button" tabIndex={0}
                 aria-label="Klik untuk membalik kartu">
              <div className={`flip-inner ${flipped ? "is-flipped" : ""}`}>
                {/* Depan */}
                <div className="flip-face bg-gradient-to-br from-sea via-sea to-deep text-white shadow-card">
                  <Blobs tone="dark" />
                  <span className="relative text-[10px] uppercase tracking-[.18em] font-semibold text-white/60">{card.tag}</span>
                  <p className="relative font-display font-bold text-2xl sm:text-3xl leading-snug mt-3 px-2">{card.f}</p>
                  {hafal && (
                    <span className="relative mt-4 inline-flex items-center gap-1.5 text-[11px] font-bold bg-emerald-500 px-2.5 py-1 rounded-full">
                      <IcCheck className="w-3.5 h-3.5" stroke={3} /> Sudah hafal
                    </span>
                  )}
                  <span className="relative text-white/55 text-xs mt-auto">Klik kartu untuk melihat jawaban</span>
                </div>
                {/* Belakang */}
                <div className="flip-face bg-gradient-to-br from-white via-paper to-sky/20 border border-sky/25 shadow-card">
                  <span className="relative text-[10px] uppercase tracking-[.18em] font-semibold text-sun">Jawaban</span>
                  <p className="relative text-ink/85 text-base sm:text-lg leading-relaxed mt-3 whitespace-pre-line px-2 overflow-y-auto nice-scroll max-h-[190px] sm:max-h-[220px]">
                    {card.b}
                  </p>
                  <span className="relative text-ink/40 text-xs mt-auto">Klik lagi untuk kembali</span>
                </div>
              </div>
            </div>

            {/* Kontrol */}
            <div className="mt-4 flex items-center gap-2">
              <button onClick={prev} disabled={pos === 0} aria-label="Kartu sebelumnya"
                className="shrink-0 w-11 h-11 rounded-full border-2 border-sky/25 text-ink/60 grid place-items-center hover:border-sea hover:text-sea disabled:opacity-30 disabled:hover:border-sky/25 transition">
                <IcBack className="w-5 h-5" />
              </button>
              <button onClick={ulangiNanti}
                className="flex-1 inline-flex items-center justify-center gap-2 rounded-full border-2 border-sky/30 text-ink/70 font-semibold py-3 text-sm hover:border-sun hover:text-sun transition">
                <IcRefresh className="w-4 h-4" /> Belum hafal
              </button>
              <button onClick={tandaiHafal}
                className="flex-1 inline-flex items-center justify-center gap-2 rounded-full bg-emerald-500 text-white font-semibold py-3 text-sm shadow-soft hover:brightness-105 active:scale-[.98] transition">
                <IcCheck className="w-4 h-4" stroke={3} /> Sudah hafal
              </button>
              <button onClick={next} aria-label="Kartu berikutnya"
                className="shrink-0 w-11 h-11 rounded-full border-2 border-sky/25 text-ink/60 grid place-items-center hover:border-sea hover:text-sea transition">
                <IcArrow className="w-5 h-5" />
              </button>
            </div>

            <p className="mt-3 text-center text-[11px] text-ink/40">
              Pintasan keyboard: <b>Spasi</b> membalik kartu · <b>←</b> / <b>→</b> pindah kartu
            </p>
          </>
        )}

        {totalHafal > 0 && (
          <div className="mt-5 pt-4 border-t border-sky/12 text-center">
            <button onClick={() => { onChange([]); build(tag, false, false); }}
              className="text-xs font-semibold text-ink/45 hover:text-red-500 transition">
              Reset progres hafalan maddah ini
            </button>
          </div>
        )}
      </div>
    </Modal>
  );
}

   MODAL SERTIFIKAT
   ========================================================================== */
function drawCertificate(canvas, data) {
  const W = 2000, H = 1414;
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  // Latar
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
  const g = ctx.createLinearGradient(0, 0, W, H);
  g.addColorStop(0, "#F7FDFF"); g.addColorStop(1, "#EAF7FA");
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);

  // Ornamen gradasi lembut di sudut (tanpa pola bintang)
  const blob = (x, y, r, color, alpha) => {
    const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
    rg.addColorStop(0, color + Math.round(alpha * 255).toString(16).padStart(2, "0"));
    rg.addColorStop(1, color + "00");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
  };
  blob(80, 60, 620, "#53BCD3", 0.30);
  blob(W - 60, H - 40, 660, "#148499", 0.22);
  blob(W - 180, 120, 380, "#F89210", 0.20);

  // Pita gradasi tipis di bawah sebagai aksen
  const band = ctx.createLinearGradient(0, 0, W, 0);
  band.addColorStop(0, "rgba(20,132,153,0)");
  band.addColorStop(0.5, "rgba(20,132,153,0.35)");
  band.addColorStop(1, "rgba(248,146,16,0)");
  ctx.fillStyle = band; ctx.fillRect(160, 1352, W - 320, 4);

  // Bingkai
  ctx.strokeStyle = "#148499"; ctx.lineWidth = 12; ctx.strokeRect(56, 56, W - 112, H - 112);
  ctx.strokeStyle = "#F89210"; ctx.lineWidth = 4;  ctx.strokeRect(84, 84, W - 168, H - 168);

  const cx = W / 2;
  ctx.textAlign = "center";

  // Kop
  if (data.logoImg) {
    const lw = 360, lh = (data.logoImg.height / data.logoImg.width) * lw;
    try { ctx.drawImage(data.logoImg, cx - lw / 2, 150, lw, lh); } catch (e) {}
  } else {
    ctx.fillStyle = "#0C5E6E"; ctx.font = "700 62px 'Host Grotesk', sans-serif";
    ctx.fillText("AHLAN AKADEMI", cx, 210);
  }
  ctx.fillStyle = "#148499"; ctx.font = "500 26px Poppins, sans-serif";
  ctx.fillText("Platform Bimbel Muqarrar E-Learning Pertama di Masisir", cx, 300);

  // Judul
  ctx.fillStyle = "#0C5E6E"; ctx.font = "700 86px 'Host Grotesk', sans-serif";
  ctx.fillText("SERTIFIKAT KELULUSAN", cx, 430);
  ctx.strokeStyle = "#F89210"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(cx - 170, 465); ctx.lineTo(cx + 170, 465); ctx.stroke();

  ctx.fillStyle = "#123B42"; ctx.font = "400 32px Poppins, sans-serif";
  ctx.fillText("Diberikan dengan bangga kepada", cx, 540);

  // Nama
  ctx.fillStyle = "#148499"; ctx.font = "700 104px 'Host Grotesk', sans-serif";
  const nama = (data.name || "").toUpperCase();
  let fs = 104;
  while (ctx.measureText(nama).width > W - 400 && fs > 44) { fs -= 4; ctx.font = `700 ${fs}px 'Host Grotesk', sans-serif`; }
  ctx.fillText(nama, cx, 660);
  ctx.strokeStyle = "rgba(18,59,66,.22)"; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(cx - 520, 700); ctx.lineTo(cx + 520, 700); ctx.stroke();

  // Keterangan
  ctx.fillStyle = "#123B42"; ctx.font = "400 32px Poppins, sans-serif";
  ctx.fillText("atas keberhasilannya menuntaskan seluruh materi bimbel muqarrar", cx, 770);

  ctx.fillStyle = "#0C5E6E"; ctx.font = "700 60px 'Host Grotesk', sans-serif";
  ctx.fillText(data.maddah, cx, 852);
  ctx.fillStyle = "#148499"; ctx.font = "500 30px Poppins, sans-serif";
  ctx.fillText(data.meta, cx, 906);

  if (data.predikat) {
    ctx.fillStyle = "#F89210"; ctx.font = "600 34px Poppins, sans-serif";
    ctx.fillText("Predikat Kuis: " + data.predikat, cx, 968);
  }

  // Kaki
  ctx.fillStyle = "#123B42"; ctx.font = "400 26px Poppins, sans-serif";
  ctx.textAlign = "left";
  ctx.fillText("Kairo, " + data.dateStr, 200, 1180);
  ctx.fillStyle = "rgba(18,59,66,.55)"; ctx.font = "400 22px Poppins, sans-serif";
  ctx.fillText("No. " + data.certNo, 200, 1225);

  ctx.textAlign = "right";
  ctx.fillStyle = "#0C5E6E"; ctx.font = "600 30px 'Host Grotesk', sans-serif";
  ctx.fillText("Ahlan Akademi", W - 200, 1180);
  ctx.strokeStyle = "rgba(18,59,66,.25)"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(W - 520, 1200); ctx.lineTo(W - 200, 1200); ctx.stroke();
  ctx.fillStyle = "rgba(18,59,66,.55)"; ctx.font = "400 22px Poppins, sans-serif";
  ctx.fillText("Tim Akademik", W - 200, 1240);

  ctx.textAlign = "center";
  ctx.fillStyle = "#F89210"; ctx.font = "600 26px Poppins, sans-serif";
  ctx.fillText("#SemuaBisaMumtaz", cx, 1310);
}

function CertificateModal({ open, onClose, maddah, user, quizResult }) {
  const [nama, setNama] = useState("");
  const [preview, setPreview] = useState("");
  const [busy, setBusy] = useState(false);
  const canvasRef = useRef(null);
  const logoRef = useRef(null);

  useEffect(() => {
    if (open) { setNama((user && user.name) || ""); setPreview(""); }
  }, [open, user]);

  useEffect(() => {
    const img = new Image();
    img.onload = () => { logoRef.current = img; };
    img.onerror = () => { logoRef.current = null; };
    img.src = LOGO_FULL;
  }, []);

  if (!open || !maddah) return null;

  const certNo = `AA/${maddah.jurusan.slice(0, 3).toUpperCase()}${maddah.tingkat}-T${maddah.termin}/${new Date().getFullYear()}/${String(Math.abs(hashCode(maddah.id + (nama || "x")))).slice(0, 5)}`;

  const build = async () => {
    const canvas = canvasRef.current || document.createElement("canvas");
    canvasRef.current = canvas;
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
    drawCertificate(canvas, {
      name: nama.trim(),
      maddah: maddah.name,
      meta: `${maddah.jurusan} Tingkat ${maddah.tingkat} — Termin ${maddah.termin} · ${maddah.tahun}`,
      predikat: quizResult ? quizResult.predikat : "",
      dateStr: tanggalID(new Date()),
      certNo,
      logoImg: logoRef.current,
    });
    return canvas;
  };

  const lihat = async () => {
    if (!nama.trim()) return;
    setBusy(true);
    const canvas = await build();
    try { setPreview(canvas.toDataURL("image/png")); }
    catch (e) { logoRef.current = null; const c2 = await build(); try { setPreview(c2.toDataURL("image/png")); } catch (e2) { setPreview(""); } }
    setBusy(false);
  };

  const unduh = async () => {
    if (!nama.trim()) return;
    setBusy(true);
    const canvas = await build();
    const finish = (url, revoke) => {
      const a = document.createElement("a");
      a.href = url;
      a.download = `Sertifikat-${maddah.name.replace(/\s+/g, "-")}-${nama.trim().replace(/\s+/g, "-")}.png`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      if (revoke) setTimeout(() => URL.revokeObjectURL(url), 2000);
      setBusy(false);
    };
    try {
      if (canvas.toBlob) canvas.toBlob((blob) => finish(URL.createObjectURL(blob), true), "image/png");
      else finish(canvas.toDataURL("image/png"), false);
    } catch (e) {
      logoRef.current = null;
      const c2 = await build();
      finish(c2.toDataURL("image/png"), false);
    }
  };

  return (
    <Modal open={open} onClose={onClose} size="lg" labelledBy="cert-title">
      <ModalHead id="cert-title" title="Unduh Sertifikat" subtitle={`${maddah.name} — ${maddah.jurusan} Tk. ${maddah.tingkat}, Termin ${maddah.termin}`} onClose={onClose} />
      <div className="p-5 sm:p-7">
        <div className="rounded-2xl bg-sand/60 border border-sun/20 p-4 flex items-start gap-3">
          <span className="shrink-0 w-9 h-9 rounded-xl bg-sun text-white grid place-items-center"><IcCap className="w-5 h-5" /></span>
          <p className="text-sm text-ink/75 leading-relaxed">
            Barakallahu fiik! Kamu sudah menuntaskan seluruh video maddah ini. Tulis namamu sesuai yang ingin tercetak di sertifikat, lalu unduh.
          </p>
        </div>

        <label className="block mt-5 text-sm font-semibold text-deep">Nama lengkap di sertifikat</label>
        <input
          value={nama}
          onChange={(e) => { setNama(e.target.value); setPreview(""); }}
          placeholder="Contoh: Rama Adhitia"
          maxLength={48}
          className="mt-2 w-full rounded-2xl border border-sky/25 bg-paper/60 px-4 py-3.5 text-ink placeholder:text-ink/35 focus:outline-none focus:ring-2 focus:ring-sea/30 focus:border-sea"
        />
        <p className="text-xs text-ink/45 mt-1.5">Pakai huruf kapital di awal kata ya, biar rapi waktu tercetak.</p>

        {quizResult && (
          <p className="text-xs text-sea font-semibold mt-3 inline-flex items-center gap-1.5">
            <IcQuiz className="w-4 h-4" /> Predikat kuis "{quizResult.predikat}" akan ikut tercantum di sertifikat.
          </p>
        )}

        {preview && (
          <div className="mt-5 rounded-2xl overflow-hidden border border-sky/20 shadow-soft pop-in">
            <img src={preview} alt="Pratinjau sertifikat" className="w-full" />
          </div>
        )}

        <div className="mt-6 flex flex-col sm:flex-row gap-2.5">
          <button onClick={lihat} disabled={!nama.trim() || busy}
            className="flex-1 inline-flex items-center justify-center gap-2 rounded-full border-2 border-sky/30 text-sea font-semibold px-6 py-3.5 text-sm hover:border-sea transition disabled:opacity-40">
            Lihat Pratinjau
          </button>
          <button onClick={unduh} disabled={!nama.trim() || busy}
            className="flex-1 inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3.5 text-sm shadow-soft hover:brightness-105 active:scale-[.98] transition disabled:opacity-40">
            <IcDownload className="w-4 h-4" /> {busy ? "Menyiapkan…" : "Unduh Sertifikat"}
          </button>
        </div>
        <canvas ref={canvasRef} className="hidden" />
      </div>
    </Modal>
  );
}

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return h;
}

function ReviewModal({ open, onClose, maddah, existing, onSubmit }) {
  const [rating, setRating] = useState(0);
  const [hover, setHover] = useState(0);
  const [teks, setTeks] = useState("");
  const [boleh, setBoleh] = useState(true);
  const [sukses, setSukses] = useState(false);

  useEffect(() => {
    if (open) {
      setRating(existing ? existing.rating : 0);
      setTeks(existing ? existing.text : "");
      setBoleh(existing ? existing.public : true);
      setSukses(false); setHover(0);
    }
  }, [open, existing]);

  if (!open || !maddah) return null;

  const label = ["", "Kurang", "Cukup", "Lumayan", "Bagus", "Luar biasa"][hover || rating] || "Kasih bintangmu";

  const kirim = () => {
    if (!rating) return;
    onSubmit({ rating, text: teks.trim(), public: boleh, at: new Date().toISOString() });
    setSukses(true);
  };

  return (
    <Modal open={open} onClose={onClose} labelledBy="rev-title">
      <ModalHead id="rev-title" title="Kasih Review" subtitle={`${maddah.name} — ${maddah.teacher}`} onClose={onClose} />
      {!sukses ? (
        <div className="p-5 sm:p-7">
          <p className="text-sm text-ink/65 leading-relaxed">
            Reviewmu bantu kami memperbaiki kualitas kelas, sekaligus bantu teman-teman Masisir lain memilih maddah. Jazakallahu khairan!
          </p>

          <div className="mt-6 text-center">
            <div className="inline-flex items-center gap-1.5" onMouseLeave={() => setHover(0)}>
              {[1, 2, 3, 4, 5].map((n) => (
                <button key={n} onClick={() => setRating(n)} onMouseEnter={() => setHover(n)} aria-label={`${n} bintang`}
                  className="p-1 transition-transform hover:scale-110 active:scale-95">
                  <IcStar className={`w-9 h-9 transition-colors ${(hover || rating) >= n ? "text-sun" : "text-sky/30"}`} />
                </button>
              ))}
            </div>
            <p className="text-sm font-semibold text-ink/70 mt-1.5">{label}</p>
          </div>

          <label className="block mt-6 text-sm font-semibold text-deep">Ceritakan pengalamanmu (opsional)</label>
          <textarea
            value={teks} onChange={(e) => setTeks(e.target.value)} rows={4} maxLength={400}
            placeholder="Contoh: Penjelasan ustadznya runtut dan gampang dipahami, rangkumannya sangat membantu waktu H-1 ujian…"
            className="mt-2 w-full rounded-2xl border border-sky/25 bg-paper/60 px-4 py-3 text-sm text-ink placeholder:text-ink/35 focus:outline-none focus:ring-2 focus:ring-sea/30 focus:border-sea resize-y"
          />
          <p className="text-xs text-ink/40 mt-1 text-right">{teks.length}/400</p>

          <label className="mt-3 flex items-start gap-2.5 cursor-pointer">
            <input type="checkbox" checked={boleh} onChange={(e) => setBoleh(e.target.checked)} className="mt-1 w-4 h-4 accent-sea" />
            <span className="text-sm text-ink/65 leading-relaxed">Boleh ditampilkan sebagai testimoni di website Ahlan Akademi.</span>
          </label>

          <div className="mt-6 flex flex-col sm:flex-row gap-2.5">
            <button onClick={onClose} className="sm:w-32 inline-flex items-center justify-center rounded-full border-2 border-sky/30 text-ink/70 font-semibold px-6 py-3.5 text-sm hover:border-ink/30 transition">Nanti aja</button>
            <button onClick={kirim} disabled={!rating}
              className="flex-1 inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3.5 text-sm shadow-soft hover:brightness-105 active:scale-[.98] transition disabled:opacity-40">
              Kirim Review <IcArrow className="w-4 h-4" />
            </button>
          </div>
        </div>
      ) : (
        <div className="p-8 sm:p-10 text-center">
          <span className="w-16 h-16 rounded-full bg-emerald-500 text-white grid place-items-center mx-auto"><IcCheck className="w-8 h-8" stroke={3} /></span>
          <h4 className="font-display font-bold text-xl text-deep mt-4">Jazakallahu khairan!</h4>
          <p className="text-sm text-ink/65 mt-2 leading-relaxed max-w-sm mx-auto">
            Review kamu sudah kami terima. Masukanmu sangat berarti buat pengembangan kelas berikutnya.
          </p>
          <button onClick={onClose} className="mt-6 inline-flex items-center justify-center gap-2 rounded-full bg-sea text-white font-semibold px-7 py-3 text-sm hover:brightness-110 transition">Tutup</button>
        </div>
      )}
    </Modal>
  );
}

/* ==========================================================================
   APP
   ========================================================================== */
function App() {
  useReveal();

  const [user, setUser] = useState(() => (SB_AKTIF ? null : store.get("user", null)));
  const [cekSesi, setCekSesi] = useState(SB_AKTIF);   // true = masih memeriksa sesi login
  const [maddahList, setMaddahList] = useState(SB_AKTIF ? [] : MY_MADDAH);
  const [muatData, setMuatData] = useState(false);    // true = sedang ambil data maddah
  const [galat, setGalat] = useState("");

  const [tab, setTab] = useState("beranda");
  const [activeId, setActiveId] = useState(null);

  const [progress, setProgress] = useState(() => store.get("progress", {}));
  const [reviews, setReviews]   = useState(() => store.get("reviews", {}));
  const [quiz, setQuiz]         = useState(() => store.get("quiz", {}));
  const [notes, setNotes]       = useState(() => store.get("notes", {}));
  const [flash, setFlash]       = useState(() => store.get("flash", {}));

  const [quizOpen, setQuizOpen] = useState(false);
  const [certOpen, setCertOpen] = useState(false);
  const [flashOpen, setFlashOpen] = useState(false);
  const [revOpen, setRevOpen]   = useState(null); // id maddah

  useEffect(() => { store.set("progress", progress); }, [progress]);
  useEffect(() => { store.set("reviews", reviews); }, [reviews]);
  useEffect(() => { store.set("quiz", quiz); }, [quiz]);
  useEffect(() => { store.set("notes", notes); }, [notes]);
  useEffect(() => { store.set("flash", flash); }, [flash]);
  useEffect(() => { if (!SB_AKTIF) store.set("user", user); }, [user]);

  /* --- Pantau status login Supabase ---------------------------------------
     onAuthStateChange langsung menyala saat halaman dibuka, jadi sekaligus
     berfungsi memulihkan sesi siswa yang sebelumnya sudah login. */
  useEffect(() => {
    if (!SB_AKTIF) return;
    const { data: sub } = sb.auth.onAuthStateChange((_event, session) => {
      if (session && session.user) {
        const u = session.user;
        setUser({
          id: u.id,
          email: u.email,
          name: (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || u.email,
        });
      } else {
        setUser(null);
      }
      setCekSesi(false);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  /* --- Simpan/segarkan profil siswa, lalu ambil maddah miliknya ----------- */
  useEffect(() => {
    if (!SB_AKTIF || !user) return;
    let batal = false;

    (async () => {
      setMuatData(true); setGalat("");
      try {
        /* Catat profil (aman dipanggil berulang — upsert, bukan insert baru) */
        await sb.from("profiles").upsert({
          id: user.id, email: user.email, full_name: user.name,
        });

        const list = await ambilMaddahSiswa(user.id);
        if (!batal) setMaddahList(list);
      } catch (e) {
        console.error(e);
        if (!batal) setGalat("Gagal memuat data maddah. Periksa koneksi, lalu muat ulang halaman.");
      } finally {
        if (!batal) setMuatData(false);
      }
    })();

    return () => { batal = true; };
    /* sengaja bergantung pada user.id saja — Supabase menyegarkan token secara
       berkala dan itu membuat objek user baru; tanpa ini data akan diambil ulang
       terus-menerus tanpa perlu. */
  }, [user && user.id]);

  const keluar = async () => {
    if (SB_AKTIF) await sb.auth.signOut();
    setUser(null); setMaddahList(SB_AKTIF ? [] : MY_MADDAH);
    setTab("beranda"); setActiveId(null);
  };

  const maddah = maddahList.find((m) => m.id === activeId) || null;

  const bukaKelas = (id) => { setActiveId(id); setTab("kelas"); window.scrollTo({ top: 0, behavior: "auto" }); };

  const toggleWatch = (epIndex, val) => {
    if (!activeId) return;
    setProgress((prev) => {
      const cur = prev[activeId] || [];
      const next = val ? (cur.includes(epIndex) ? cur : [...cur, epIndex]) : cur.filter((i) => i !== epIndex);
      return { ...prev, [activeId]: next };
    });
  };

  if (cekSesi)  return <LayarTunggu teks="Memeriksa sesi masukmu…" />;
  if (!user)    return <LoginGate onLogin={(u) => setUser(u)} />;
  if (muatData) return <LayarTunggu teks="Menyiapkan ruang belajarmu…" />;

  return (
    <>
      <Navbar user={user} onLogout={keluar}
              tab={tab} onTab={(t) => { if (t === "beranda") { setTab("beranda"); } else if (activeId) setTab("kelas"); }} />

      <div className="pt-16">
        <TabBar
          tab={tab}
          onTab={(t) => { if (t === "kelas" && !activeId) return; setTab(t); }}
          canOpenClass={!!activeId}
          activeName={maddah ? maddah.name : ""}
        />

        {galat && (
          <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-5">
            <p className="text-sm text-red-700 bg-red-50 border border-red-100 rounded-2xl px-4 py-3">{galat}</p>
          </div>
        )}

        {tab === "beranda" && (
          <Beranda
            user={user}
            maddahList={maddahList}
            progress={progress}
            reviews={reviews}
            quiz={quiz}
            onBelajar={bukaKelas}
            onReview={(id) => setRevOpen(id)}
          />
        )}

        {tab === "kelas" && maddah && (
          <ELearning
            key={maddah.id}
            maddah={maddah}
            watched={progress[maddah.id] || []}
            onToggleWatch={toggleWatch}
            onBack={() => setTab("beranda")}
            onOpenQuiz={() => setQuizOpen(true)}
            onOpenCert={() => setCertOpen(true)}
            onOpenReview={() => setRevOpen(maddah.id)}
            onOpenFlash={() => setFlashOpen(true)}
            quizResult={quiz[maddah.id]}
            memorized={flash[maddah.id] || []}
            notes={notes[maddah.id] || ""}
            onNotes={(v) => setNotes((p) => ({ ...p, [maddah.id]: v }))}
          />
        )}
      </div>

      <Footer />
      <FloatingWA />

      <QuizModal
        open={quizOpen} onClose={() => setQuizOpen(false)} maddah={maddah}
        onFinish={(res) => setQuiz((p) => ({ ...p, [maddah.id]: res }))}
      />
      <FlashcardModal
        open={flashOpen} onClose={() => setFlashOpen(false)} maddah={maddah}
        memorized={maddah ? (flash[maddah.id] || []) : []}
        onChange={(arr) => setFlash((p) => ({ ...p, [maddah.id]: arr }))}
      />
      <CertificateModal
        open={certOpen} onClose={() => setCertOpen(false)} maddah={maddah}
        user={user} quizResult={maddah ? quiz[maddah.id] : null}
      />
      <ReviewModal
        open={!!revOpen} onClose={() => setRevOpen(null)}
        maddah={maddahList.find((m) => m.id === revOpen) || null}
        existing={revOpen ? reviews[revOpen] : null}
        onSubmit={(r) => setReviews((p) => ({ ...p, [revOpen]: r }))}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
