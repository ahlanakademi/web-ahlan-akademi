function cartGet() {
  try { return JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch (e) { return []; }

function cartSet(ids) {
  localStorage.setItem(CART_KEY, JSON.stringify(ids));
  window.dispatchEvent(new Event("keranjang-berubah"));
}
function cartAdd(id) { const c = cartGet(); if (!c.includes(id)) cartSet([...c, id]); }
function cartRemove(id) { cartSet(cartGet().filter((x) => x !== id)); }
function cartHas(id) { return cartGet().includes(id); }
function cartClear() { cartSet([]); }
function useCartCount() {
  const [n, setN] = useState(() => cartGet().length);
  useEffect(() => {
    const update = () => setN(cartGet().length);

    window.addEventListener("storage", update);
    return () => { window.removeEventListener("keranjang-berubah", update); window.removeEventListener("storage", update); };
  }, []);
  return n;
}

/* Penyimpanan progres — dibungkus try/catch supaya aman di semua lingkungan.
   Kalau nanti sudah ada backend, cukup ganti isi get/set ini dengan panggilan API. */
const memoryStore = {};
const store = {
  get(key, fallback) {
    try {
      const raw = window.localStorage.getItem("ahlan:" + key);
      if (raw != null) return JSON.parse(raw);
    } catch (e) { /* diabaikan */ }
    return key in memoryStore ? memoryStore[key] : fallback;
  },
  set(key, val) {
    memoryStore[key] = val;
    try { window.localStorage.setItem("ahlan:" + key, JSON.stringify(val)); } catch (e) { /* diabaikan */ }
  },
};

  if (!detik) return "0 Jam";
  const jam = Math.floor(detik / 3600);
  const menit = Math.round((detik % 3600) / 60);
  if (jam === 0) return `${menit} Menit`;
  return menit === 0 ? `${jam} Jam` : `${jam} Jam ${menit} Menit`;
};

/* 3720 (detik) -> "62:00" ; kalau null/0 dikembalikan string kosong */
const formatDurasi = (detik) => {
  if (!detik) return "";
  const m = Math.floor(detik / 60), d = detik % 60;
  return `${m}:${String(d).padStart(2, "0")}`;
};

/* Ubah 1 baris tabel `maddah` + episode + materi jadi bentuk yang dipakai UI */
/* Cari index jawaban benar dari kolom `jawaban`, robust terhadap beberapa
   cara Faruq mungkin mengisi: angka 1-4 (nomor opsi), huruf A-D, atau
   nyalin persis teks jawaban yang benar dari kolom `opsi`. */
function cariIndexJawaban(opsi, jawaban) {
  if (jawaban === null || jawaban === undefined) return 0;
  if (typeof jawaban === "number") {
    if (jawaban >= 1 && jawaban <= opsi.length) return jawaban - 1; // 1-4
    if (jawaban >= 0 && jawaban < opsi.length) return jawaban;      // 0-3
  }
  const s = String(jawaban).trim();
  const cocokTeks = opsi.findIndex((o) => String(o).trim() === s);
  if (cocokTeks !== -1) return cocokTeks;
  const petaHuruf = { a: 0, b: 1, c: 2, d: 3 };
  const huruf = s.toLowerCase();
  if (huruf in petaHuruf) return petaHuruf[huruf];
  const angka = parseInt(s, 10);
  if (!isNaN(angka)) return cariIndexJawaban(opsi, angka);
  return 0;
}

const bentukMaddah = (row, episodes, materials, quiz) => ({
  id:        row.id,
  name:      row.nama,
  teacher:   row.pengajar || "",
  teacherFoto: row.pengajar_foto || "",
  teacherPendidikan: row.pengajar_pendidikan || "",

  rangkuman: materials.map((m) => ({

    lang:  (m.bahasa || "id").toUpperCase() === "AR" ? "AR" : "ID",
    note:  m.bahasa === "ar"
             ? "Teks Arab asli, cocok buat latihan istilah ujian."
             : "Ringkasan lengkap muqarrar, siap dibaca H-1 ujian.",
  })),
  episodes: episodes.map((e) => ({
    title: e.judul,
    dur:   formatDurasi(e.durasi),
    videoId: e.video_id || "",
  })),
  quiz: (quiz || []).map((q) => {
    const opsi = Array.isArray(q.opsi) ? q.opsi : [];
    return {
      q: q.pertanyaan,
      opts: opsi,
      a: cariIndexJawaban(opsi, q.jawaban),
      exp: q.pembahasan || "",
    };
  }),
});

async function ambilMaddahSiswa(userId) {
  /* a. maddah apa saja yang enrollment-nya aktif */
  const { data: enrol, error: e1 } = await sb
    .from("enrollments")
    .select("maddah_id, maddah(*)")
    .eq("user_id", userId)
    .eq("status", "active");
  if (e1) throw e1;
  if (!enrol || enrol.length === 0) return [];

  const ids = enrol.map((r) => r.maddah_id);

  /* b. semua episode, materi, & soal kuis untuk maddah tersebut (sekali query, bukan per-maddah) */
  const [{ data: eps, error: e2 }, { data: mats, error: e3 }, { data: quizRows, error: e4 }] = await Promise.all([
    sb.from("episodes").select("*").in("maddah_id", ids).order("urutan"),
    sb.from("materials").select("*").in("maddah_id", ids),
    sb.from("quiz_questions").select("*").in("maddah_id", ids),
  ]);
  if (e2) throw e2;
  if (e3) throw e3;
  if (e4) throw e4;

  return enrol
    .filter((r) => r.maddah)
    .map((r) => bentukMaddah(
      r.maddah,
      (eps || []).filter((e) => e.maddah_id === r.maddah_id),
      (mats || []).filter((m) => m.maddah_id === r.maddah_id),
      (quizRows || []).filter((q) => q.maddah_id === r.maddah_id),
    ));
}

/* PDF ada di bucket PRIVAT, jadi tautannya dibuat sesaat (berlaku 60 detik).
   Tanpa ini, file cuma bisa dibuka lewat dashboard Supabase. */
/* Bersihin URL Supabase Storage secara otomatis:
   - buang "/object/sign/" jadi "/object/" (biar jadi public URL, bukan signed URL yang butuh token)
   - buang query string "?token=..." yang ikut ke-copy dari tombol "Get URL" di dashboard
   Jadi Faruq bisa copas apa adanya dari Supabase Storage tanpa perlu edit manual. */
function bersihkanUrlStorage(url) {
  if (!url) return url;
  return url
    .replace("/storage/v1/object/sign/", "/storage/v1/object/")
    .split("?")[0];
}

async function unduhMateri(filePath) {
  if (!filePath) { alert("File tidak ditemukan."); return; }
  // Kalau sudah full URL (dari public bucket), bersihkan dulu lalu langsung buka
  if (filePath.startsWith("http://") || filePath.startsWith("https://")) {
    window.open(bersihkanUrlStorage(filePath), "_blank");
    return;
  }
  // Kalau relative path, buat signed URL
  if (!SB_AKTIF) { window.open(filePath, "_blank"); return; }
  const { data, error } = await sb.storage
    .from(BUCKET_MATERI)
    .createSignedUrl(filePath, 60);
  if (error || !data) { alert("Gagal membuka file. Coba lagi sebentar lagi ya."); return; }
  window.open(data.signedUrl, "_blank");
}

function useReveal() {
  useEffect(() => {
    const io = new IntersectionObserver((entries) => {
      entries.forEach((e) => { if (e.isIntersecting) { e.target.classList.add('in-view'); io.unobserve(e.target); } });
    }, { threshold: 0.12 });
    const observeAll = () => document.querySelectorAll('.reveal:not(.in-view)').forEach((el) => io.observe(el));
    observeAll();
    const mo = new MutationObserver(observeAll);
    mo.observe(document.body, { childList: true, subtree: true });
    return () => { io.disconnect(); mo.disconnect(); };
  }, []);
}

/* Modal serba guna */
function Modal({ open, onClose, children, size = "md", labelledBy }) {
  useEffect(() => {
    if (!open) return;
    document.body.classList.add("modal-open");
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    window.addEventListener("keydown", onKey);
    return () => { document.body.classList.remove("modal-open"); window.removeEventListener("keydown", onKey); };
  }, [open, onClose]);
  if (!open) return null;
  const w = size === "lg" ? "max-w-3xl" : size === "xl" ? "max-w-5xl" : "max-w-lg";
  return (
    <div className="fixed inset-0 z-[70] flex items-end sm:items-center justify-center p-0 sm:p-4 fade-in" role="dialog" aria-modal="true" aria-labelledby={labelledBy}>
      <div className="absolute inset-0 bg-ink/60 backdrop-blur-sm" onClick={onClose} />
      <div className={`relative w-full ${w} bg-white rounded-t-3xl sm:rounded-3xl shadow-card max-h-[92vh] overflow-y-auto nice-scroll pop-in`}>
        {children}
      </div>
    </div>
  );
}

/* ==========================================================================
   HALAMAN LOGIN (mock)
   Ganti isi handler onGoogle dengan Google Identity Services / Firebase Auth.
   ========================================================================== */
function LoginGate({ onLogin }) {
  const [loading, setLoading] = useState(false);
  const [pesan, setPesan] = useState("");

  const masuk = async () => {
    setLoading(true); setPesan("");

    /* MODE DEMO — selama SUPABASE_URL & ANON_KEY masih kosong.
       Berguna buat cek tampilan tanpa perlu database. */
    if (!SB_AKTIF) {
      setTimeout(() => onLogin({ name: "Rama Adhitia", email: "rama.adhitia@gmail.com" }), 700);
      return;
    }

    /* MODE ASLI — Supabase yang mengurus seluruh proses OAuth Google.
       Setelah siswa menekan tombol, browser pindah ke halaman Google,
       lalu kembali lagi ke halaman ini dengan sesi yang sudah aktif. */
    /* Kirim redirectTo secara EKSPLISIT, dibangun ulang dari origin+path
       halaman ini (BUKAN window.location.href apa adanya). Ini sengaja —
       kalau login sebelumnya sempat nempelin hash #access_token=... di
       belakang URL dan belum kebersihan, window.location.href jadi "kotor"
       dan gagal cocok dengan daftar Redirect URLs di Supabase, yang bikin
       Supabase jatuhin ke Site URL default (root domain) alih-alih ke
       halaman ini — makanya login kedua dst bisa nyasar ke beranda.
       PENTING: pastikan alamat ini (origin+path halaman ini, tanpa query
       atau hash) ada di daftar "Redirect URLs" Supabase (Authentication →
       URL Configuration), bukan cuma di "Site URL". */
    const tujuanBalik = window.location.origin + window.location.pathname;
    const { error } = await sb.auth.signInWithOAuth({
      provider: "google",
      options: { redirectTo: tujuanBalik },
    });

    if (error) {
      setLoading(false);
      setPesan("Gagal menghubungkan ke Google. Coba lagi sebentar lagi ya.");
    }
  };
  return (
    <main className="min-h-screen grid place-items-center px-4 py-24 relative overflow-hidden">
      <div className="absolute inset-0 bg-gradient-to-b from-paper via-paper to-sky/10" aria-hidden="true"></div>
      <Blobs />

      <div className="relative w-full max-w-md bg-white rounded-3xl shadow-card border border-sky/15 p-8 sm:p-10 text-center">
        <img src={LOGO_FULL} alt="Ahlan Akademi" className="h-10 w-auto mx-auto" onError={(e) => { e.target.style.display = 'none'; }} />
        <span className="tab-label mt-6 inline-block">Ruang Belajar</span>
        <h1 className="font-display font-bold text-2xl sm:text-3xl text-deep mt-4">Ahlan wa Sahlan 👋</h1>
        <p className="text-ink/65 text-sm mt-2 leading-relaxed">
          Yuk login dan luangkan waktu 30 menit untuk belajar muqarrar hari ini!
        </p>

        <button onClick={masuk} disabled={loading}
          className="mt-7 w-full inline-flex items-center justify-center gap-3 rounded-full bg-white border-2 border-sky/30 py-3.5 font-semibold text-ink hover:border-sea hover:shadow-soft active:scale-[.98] transition disabled:opacity-60">
          {loading ? (
            <><span className="w-5 h-5 rounded-full border-2 border-sea/30 border-t-sea animate-spin" /> Menghubungkan…</>
          ) : (
            <><IcGoogle /> Masuk dengan Google</>
          )}
        </button>

        {pesan && (
          <p className="mt-4 text-sm text-red-600 bg-red-50 border border-red-100 rounded-xl px-4 py-2.5">{pesan}</p>
        )}

        <p className="text-xs text-ink/45 mt-5 leading-relaxed">
          <a href={HOME_URL} target="_blank" rel="noopener" className="text-sea font-semibold hover:underline">Kembali ke Beranda</a><br />
          Ada kendala masuk? <a href={`${WA_URL}?text=${encodeURIComponent(WA_TEKNIS)}`} target="_blank" rel="noopener" className="text-sea font-semibold hover:underline">Chat admin</a>.
        </p>
      </div>
    </main>
  );
}

/* Kartu maddah — desainnya sama persis dengan MaddahCard di katalog.html.
   Bedanya: "Lihat Detail" buka modal internal (bukan pindah halaman), dan
   ada status "Sudah Kamu Miliki" karena di sini konteksnya siswa yang login. */
function MaddahCard({ m, index, dimiliki, onDetail }) {
  const soon = m.status === "soon";
  const waLink = `${WA_URL}?text=${encodeURIComponent(
    `Assalamualaikum, kak, mau tanya maddah ${m.name} (${m.jurusan} Tk. ${m.tingkat} · Termin ${m.termin}) dong`
  )}`;
  const discount = m.originalPrice > 0 ? Math.round((1 - m.price / m.originalPrice) * 100) : 0;
  const [diKeranjang, setDiKeranjang] = useState(() => cartHas(m.id));
  useEffect(() => {
    const sync = () => setDiKeranjang(cartHas(m.id));
    window.addEventListener("keranjang-berubah", sync);
    return () => window.removeEventListener("keranjang-berubah", sync);
  }, [m.id]);
  const toggleKeranjang = () => { if (diKeranjang) cartRemove(m.id); else cartAdd(m.id); };

  return (
    <div className="card-in group bg-white rounded-2xl border border-sky/20 shadow-sm hover:shadow-card transition-all duration-300 hover:-translate-y-1 overflow-hidden flex flex-col h-full"
         style={{ animationDelay: `${Math.min(index, 8) * 55}ms` }}>
      <div className="relative">
        <MaddahCover src={m.cover} alt={`Cover maddah ${m.name}`} />

        {dimiliki && (
          <span className="absolute top-3 left-3 text-[10px] font-bold uppercase tracking-wide rounded-full px-2.5 py-1 shadow-sm bg-sea text-white">
            Sudah Kamu Miliki
          </span>
        )}
        {!dimiliki && discount > 0 && (
          <span className="absolute top-3 right-3 text-[10px] font-bold rounded-full px-2.5 py-1 bg-white/95 text-sun shadow-sm">
            Hemat {discount}%
          </span>
        )}
        {soon && (
          <span className="absolute bottom-3 left-3 inline-flex items-center gap-1.5 text-[10px] font-semibold rounded-full px-2.5 py-1 bg-deep/85 text-white backdrop-blur-sm">
            <IcClock className="w-3 h-3" /> Segera dibuka
          </span>
        )}
      </div>

      <div className="p-4 sm:p-5 flex-1 flex flex-col">
        <div className="flex items-center gap-1.5 flex-wrap">
          <span className={`text-[10px] font-bold uppercase tracking-wide rounded-full px-2.5 py-1 text-white ${(MODE_INFO[m.mode] || MODE_INFO["e-learning"]).bg}`}>
            {(MODE_INFO[m.mode] || MODE_INFO["e-learning"]).label}

          <span className="text-[10px] font-semibold uppercase tracking-wide text-sun bg-sun/10 rounded-full px-2.5 py-1">Tingkat {m.tingkat}</span>
          <span className="text-[10px] font-semibold uppercase tracking-wide text-ink/50 bg-ink/5 rounded-full px-2.5 py-1">Termin {m.termin}</span>
        </div>

        <h3 className="mt-2.5 font-display font-semibold text-ink text-base sm:text-lg leading-snug">{m.name}</h3>

        <div className="mt-2.5 flex items-center gap-3 text-[11px] font-medium text-ink/60">

            <span className="inline-flex items-center gap-1.5"><IcClock className="w-3.5 h-3.5 text-sea" /> {m.jumlahPertemuan} Pertemuan</span>
          ) : (
            <>
              <span className="inline-flex items-center gap-1.5"><IcPlay className="w-3.5 h-3.5 text-sea" /> {m.episodes} video</span>

        <button onClick={() => onDetail(m.id)}

/* Skema diskon ambil banyak maddah sekaligus — port dari katalog.html */
const HARGA_NORMAL = 105000;
const PAKET_OPSI = [
  { n: 1, label: "Normal", rate: 0,    tag: null },
  { n: 3, label: "3 Maddah", rate: 0.05, tag: "Hemat 5%" },
  { n: 5, label: "Bundling", rate: 0.10, tag: "Hemat 10%" },
];

function SkemaDiskon() {
  const [pilih, setPilih] = useState(1);
  const opsi = PAKET_OPSI[pilih];
  const subtotal = HARGA_NORMAL * opsi.n;
  const potongan = Math.round(subtotal * opsi.rate);
  const total = subtotal - potongan;

  const waLink = `${WA_URL}?text=${encodeURIComponent(
    `Assalamualaikum, kak, mau ambil paket ${opsi.label.toLowerCase()}${opsi.rate > 0 ? ` (diskon ${Math.round(opsi.rate * 100)}%)` : ""} dong`
  )}`;

  return (
    <section className="py-10 sm:py-12">
      <div className="max-w-md mx-auto px-4 sm:px-6">
        <div className="reveal bg-white rounded-3xl border border-sky/20 shadow-soft p-5 sm:p-6">
          <div className="flex items-center gap-2">
            <span className="w-8 h-8 rounded-xl bg-sun/10 flex items-center justify-center text-sun shrink-0">
              <IcTag className="w-4 h-4" />
            </span>
            <div>
              <h2 className="font-display font-semibold text-ink text-base sm:text-lg leading-tight">Ambil lebih hemat</h2>
              <p className="text-[11.5px] text-ink/50">Harga normal {idr(HARGA_NORMAL)} / maddah</p>
            </div>
          </div>

          <div className="mt-4 grid grid-cols-3 gap-2">
            {PAKET_OPSI.map((o, i) => {
              const aktif = i === pilih;
              return (
                <button key={i} onClick={() => setPilih(i)}
                  className={`rounded-xl px-2 py-2.5 border text-center transition-all duration-200 active:scale-95
                    ${aktif ? "bg-sun border-sun text-white shadow-soft" : "bg-paper border-sky/25 text-ink/70 hover:border-sea/50 hover:text-sea"}`}>
                  <span className="block font-display font-semibold text-[13px]">{o.label}</span>
                  <span className={`block mt-0.5 text-[10px] font-medium ${aktif ? "text-white/85" : "text-ink/40"}`}>
                    {o.tag || "Normal"}
                  </span>
                </button>
              );
            })}
          </div>

          <div className="mt-4 space-y-2 text-sm">
            <div className="flex items-center justify-between">
              <span className="text-ink/55">Harga normal</span>
              <span className={potongan > 0 ? "text-ink/40 line-through" : "text-ink font-medium"}>{idr(subtotal)}</span>
            </div>
            {potongan > 0 && (
              <div className="flex items-center justify-between">
                <span className="text-ink/55">Diskon {Math.round(opsi.rate * 100)}%</span>
                <span className="text-sea font-semibold">− {idr(potongan)}</span>
              </div>
            )}
            <div className="h-px bg-sky/15"></div>
            <div className="flex items-baseline justify-between pt-0.5">
              <span className="font-display font-semibold text-ink text-sm">Total bayar</span>
              <span className="font-display font-bold text-sun text-xl">{idr(total)}</span>
            </div>
          </div>

          <a href={waLink} target="_blank" rel="noopener"
             className="group mt-4 w-full inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold text-sm px-5 py-3 hover:brightness-105 transition-all active:scale-[0.98]">
            {opsi.rate > 0 ? `Klaim Diskon ${Math.round(opsi.rate * 100)}%` : "Daftar Sekarang"}
            <IcArrow className="w-4 h-4 transition-transform group-hover:translate-x-1" />
          </a>
        </div>
      </div>
    </section>
  );
}

function KatalogTab({ dimilikiIds, onCheckout, onDetail }) {
  const [list, setList] = useState([]);
  const [memuat, setMemuat] = useState(true);
  const [galat, setGalat] = useState("");
  const [query, setQuery] = useState("");
  const [jurusan, setJurusan] = useState("all");
  const [tingkat, setTingkat] = useState("all");
  const [termin, setTermin] = useState("all");

  useEffect(() => {
    let batal = false;
    (async () => {
      if (!SB_AKTIF) { setMemuat(false); return; }
      try {
        const data = await ambilSemuaKatalog();
        if (!batal) setList(data);
      } catch (e) {
        console.error(e);
        if (!batal) setGalat("Gagal memuat katalog. Muat ulang halaman ya.");
      } finally {
        if (!batal) setMemuat(false);
      }
    })();
    return () => { batal = true; };
  }, []);

  const uniq = (key) => [...new Set(list.map((m) => m[key]))].filter(Boolean).sort((a, b) => (a > b ? 1 : -1));
  const jurusanOpts = uniq("jurusan");
  const tingkatOpts = uniq("tingkat");
  const terminOpts = uniq("termin");

  const hasil = useMemo(() => {
    const q = query.trim().toLowerCase();
    return list.filter((m) =>
      (jurusan === "all" || m.jurusan === jurusan) &&
      (tingkat === "all" || m.tingkat === tingkat) &&
      (termin === "all" || m.termin === termin) &&
      (q === "" || m.name.toLowerCase().includes(q) || m.teacher.toLowerCase().includes(q))
    );
  }, [list, jurusan, tingkat, termin, query]);

  const aktif = [jurusan !== "all", tingkat !== "all", termin !== "all", query.trim() !== ""].filter(Boolean).length;
  const reset = () => { setJurusan("all"); setTingkat("all"); setTermin("all"); setQuery(""); };

  return (
    <main className="pt-6 pb-16">
      <div className="max-w-6xl mx-auto px-4 sm:px-6">
        <h1 className="font-display font-bold text-2xl sm:text-3xl text-deep">Katalog Maddah</h1>
        <p className="text-ink/60 text-sm mt-1.5">Mau ambil maddah lain buat termin ini? Cek semua pilihan yang ada di sini.</p>

        {/* Panel filter — search + dropdown sejajar dalam satu baris */}
        <div className="mt-5 bg-white rounded-3xl border border-sky/20 shadow-soft p-4 sm:p-6">
          <div className="flex flex-col sm:flex-row sm:items-center gap-3">
            <div className="flex items-center gap-2 text-sea">
              <IcSliders className="w-5 h-5" />
              <span className="font-display font-semibold text-base">Saring maddah</span>
            </div>
            <div className="sm:ml-auto flex flex-wrap items-center gap-2 w-full sm:w-auto">
              <div className="relative flex-1 sm:w-56">
                <IcSearch className="w-4 h-4 absolute left-3.5 top-1/2 -translate-y-1/2 text-ink/35" />
                <input type="text" value={query} onChange={(e) => setQuery(e.target.value)}
                  placeholder="Cari maddah atau pengajar..."
                  className="w-full rounded-full border border-sky/25 bg-paper/60 pl-10 pr-4 py-2.5 text-sm text-ink placeholder:text-ink/35 focus:outline-none focus:ring-4 focus:ring-sea/15 focus:border-sea/50 transition" />
              </div>
              <FilterSelect value={jurusan} onChange={setJurusan} options={jurusanOpts} allLabel="Semua Jurusan" />
              <FilterSelect value={tingkat} onChange={setTingkat} options={tingkatOpts} allLabel="Semua Tingkat" format={(v) => "Tingkat " + v} />
              <FilterSelect value={termin} onChange={setTermin} options={terminOpts} allLabel="Semua Termin" format={(v) => "Termin " + v} />
            </div>
          </div>
        </div>

        {/* Info hasil */}
        <div className="mt-6 flex flex-wrap items-center justify-between gap-3">
          <p className="text-sm text-ink/60">
            Nampilin <b className="text-ink">{hasil.length}</b> dari {list.length} maddah
            {aktif > 0 && <span className="text-ink/45"> · {aktif} filter aktif</span>}
          </p>
          {aktif > 0 && (
            <button onClick={reset} className="text-xs font-semibold text-sea hover:text-sun transition-colors underline underline-offset-4">
              Hapus semua filter
            </button>
          )}
        </div>

        {galat && <p className="mt-4 text-sm text-red-700 bg-red-50 border border-red-100 rounded-2xl px-4 py-3">{galat}</p>}

        {memuat ? (
          <div className="py-16 text-center text-ink/45 text-sm">Memuat katalog…</div>
        ) : hasil.length === 0 ? (
          <div className="mt-5 bg-white rounded-3xl border border-dashed border-sky/40 px-6 py-14 text-center">
            <div className="w-14 h-14 mx-auto rounded-2xl bg-sky/10 flex items-center justify-center text-sea">
              <IcSearch className="w-7 h-7" />
            </div>
            <h3 className="mt-4 font-display font-semibold text-ink text-lg">Belum ada maddah yang cocok</h3>
            <p className="mt-2 text-sm text-ink/60 max-w-sm mx-auto">Coba longgarin filternya, atau hapus semua filter dulu.</p>
          </div>
        ) : (
          <div className="mt-5 grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 sm:gap-5">
            {hasil.map((m, i) => (
              <MaddahCard key={m.id} m={m} index={i} dimiliki={dimilikiIds.includes(m.id)} onDetail={onDetail} />
            ))}
          </div>
        )}
      </div>

      <SkemaDiskon />
    </main>
  );
}

/* ==========================================================================
   TESTIMONI — cuma review bintang 5 yang boleh publik, sebelum checkout
   ========================================================================== */
function Testimoni({ maddahId }) {
  const [daftar, setDaftar] = useState([]);
  const [memuat, setMemuat] = useState(true);

  useEffect(() => {
    if (!SB_AKTIF || !maddahId) { setMemuat(false); return; }
    let batal = false;
    (async () => {
      try {
        const { data } = await sb.rpc("maddah_testimoni", { p_maddah_id: maddahId });
        if (!batal) setDaftar(data || []);
      } catch (e) {
        console.error(e);
      } finally {
        if (!batal) setMemuat(false);
      }
    })();
    return () => { batal = true; };
  }, [maddahId]);

  if (memuat || daftar.length === 0) return null;   // belum ada testimoni bintang 5 — sembunyikan section

  return (
    <section className="mt-14">
      <span className="tab-label">Kata Mereka</span>
      <h2 className="font-display font-bold text-xl sm:text-2xl text-deep mt-3">Testimoni Siswa</h2>
      <div className="mt-5 grid sm:grid-cols-2 gap-4">
        {daftar.map((t, i) => (
          <div key={i} className="reveal bg-white rounded-3xl border border-sky/18 shadow-soft p-5">
            <div className="flex items-center gap-1 text-sun">
              {[1, 2, 3, 4, 5].map((n) => (
                <svg key={n} viewBox="0 0 20 20" className="w-4 h-4" fill="currentColor"><path d="M10 1.5l2.6 5.6 6 .7-4.4 4.1 1.2 6-5.4-3-5.4 3 1.2-6-4.4-4.1 6-.7z" /></svg>
              ))}
            </div>
            <p className="text-sm text-ink/70 mt-3 leading-relaxed">"{t.komentar}"</p>
            <p className="text-xs font-semibold text-deep mt-3">{t.nama_depan}</p>
          </div>
        ))}
      </div>
    </section>
  );
}

/* ==========================================================================
   POP-UP "BARU SAJA DAFTAR" — social proof, cuma nama depan, tanpa data lain
   ========================================================================== */

function PopupPembeli({ maddahId, namaMaddah }) {
  const [daftar, setDaftar] = useState([]);
  const [idx, setIdx] = useState(0);
  const [tampil, setTampil] = useState(false);

  /* Ambil daftar pembeli sekali saat halaman dibuka */
  useEffect(() => {
    if (!SB_AKTIF || !maddahId) return;
    let batal = false;
    (async () => {
      try {
        const { data } = await sb.rpc("maddah_pembeli", { p_maddah_id: maddahId });
        if (!batal && data) setDaftar(data);
      } catch (e) {
        console.error(e);
      }
    })();
    return () => { batal = true; };
  }, [maddahId]);

  /* Muncul-hilang bergantian tiap beberapa detik, ganti nama tiap putaran */
  useEffect(() => {
    if (daftar.length === 0) return;
    let mounted = true;
    const munculkan = () => {
      if (!mounted) return;
      setTampil(true);
      setTimeout(() => { if (mounted) setTampil(false); }, 4500);
    };
    const t1 = setTimeout(munculkan, 2500); // kemunculan pertama
    const interval = setInterval(() => {
      setIdx((i) => (i + 1) % daftar.length);
      munculkan();
    }, 8000);
    return () => { mounted = false; clearTimeout(t1); clearInterval(interval); };
  }, [daftar]);

  if (daftar.length === 0) return null;
  const p = daftar[idx];

  return (
    <div className={`fixed left-3 bottom-20 sm:left-5 lg:bottom-5 z-30 transition-all duration-500 ${tampil ? "opacity-100 translate-y-0" : "opacity-0 translate-y-3 pointer-events-none"}`}>
      <div className="bg-white rounded-2xl shadow-card border border-sky/18 pl-3.5 pr-4 py-3 flex items-center gap-3 max-w-[280px]">
        <span className="shrink-0 w-9 h-9 rounded-full bg-sea/10 text-sea grid place-items-center">
          <IcUsers className="w-4 h-4" />
        </span>
        <p className="text-xs text-ink/70 leading-snug">
          <span className="font-semibold text-deep">{p.nama_depan}</span> baru saja daftar
          <span className="block text-[10px] text-ink/45 mt-0.5">{namaMaddah}</span>
        </p>
      </div>
    </div>
  );
}

/* ==========================================================================
   MODAL CHECKOUT — keranjang, voucher, info pembayaran, dan tombol Bayar
   yang manggil Edge Function "checkout" (satu-satunya tempat yang tahu
   API Key Mayar). Ini SATU-SATUNYA tempat di seluruh situs siswa bisa
   benar-benar bayar — halaman lain cuma etalase yang ngarahin ke sini.
   ========================================================================== */
function CheckoutPage({ dimilikiIds, onKatalog, onBeranda }) {
  const [ids, setIds] = useState(() => cartGet());
  const [rows, setRows] = useState([]);
  const [memuat, setMemuat] = useState(true);
  const [galat, setGalat] = useState("");

  const [voucherInput, setVoucherInput] = useState("");
  const [voucherAktif, setVoucherAktif] = useState("");
  const [cekVoucher, setCekVoucher] = useState(false);
  const [pesanVoucher, setPesanVoucher] = useState("");
  const [diskon, setDiskon] = useState(0);
  const [diskonLabel, setDiskonLabel] = useState("");

  const [membayar, setMembayar] = useState(false);
  const [galatBayar, setGalatBayar] = useState("");
  const [mayarLink, setMayarLink] = useState("");
  const [gratisSukses, setGratisSukses] = useState(false);
  const [noHp, setNoHp] = useState(() => localStorage.getItem("ahlan_no_hp") || "");

  /* Rekomendasi: katalog lengkap, dipakai buat nyari maddah lain yang cocok
     (jurusan + termin sama) dengan yang ada di keranjang */
  const [katalog, setKatalog] = useState([]);
  const [memuatKatalog, setMemuatKatalog] = useState(true);

  useEffect(() => {
    window.scrollTo({ top: 0, behavior: "auto" });
    setGalatBayar(""); setMayarLink(""); setGratisSukses(false);
    setVoucherInput(""); setVoucherAktif(""); setPesanVoucher(""); setDiskon(0); setDiskonLabel("");
  }, []);

  /* Sinkron kalau keranjang berubah dari tempat lain (misal nambah 1 lagi
     dari kartu rekomendasi atau dari tab Katalog) */
  useEffect(() => {
    const sync = () => setIds(cartGet());
    sync();
    window.addEventListener("keranjang-berubah", sync);
    return () => window.removeEventListener("keranjang-berubah", sync);
  }, []);

  /* Ambil harga & nama TERBARU dari Supabase — jangan pernah percaya angka
     yang nyantol di localStorage */
  useEffect(() => {
    let batal = false;
    (async () => {
      setMemuat(true); setGalat("");
      if (!SB_AKTIF || ids.length === 0) { setRows([]); setMemuat(false); return; }
      try {
        const { data, error } = await sb.from("maddah")
          .select("id, nama, harga, harga_coret, cover_url, jurusan, tingkat, termin").in("id", ids);
        if (error) throw error;
        // buang yang udah dimiliki siswa (kalau ada nyangkut dari sebelumnya)
        const bersih = (data || []).filter((r) => !dimilikiIds.includes(r.id));
        if (bersih.length < ids.length) cartSet(bersih.map((r) => r.id));
        if (!batal) setRows(bersih);
      } catch (e) {
        console.error(e);
        if (!batal) setGalat("Gagal memuat isi keranjang.");
      } finally {
        if (!batal) setMemuat(false);
      }
    })();
    return () => { batal = true; };
  }, [ids.join(","), dimilikiIds.join(",")]);

  /* Ambil katalog lengkap sekali di awal, buat sumber rekomendasi */
  useEffect(() => {
    let batal = false;
    (async () => {
      if (!SB_AKTIF) { setMemuatKatalog(false); return; }
      try {
        const data = await ambilSemuaKatalog();
        if (!batal) setKatalog(data);
      } catch (e) {
        console.error(e);
      } finally {
        if (!batal) setMemuatKatalog(false);
      }
    })();
    return () => { batal = true; };
  }, []);

  /* Maddah lain yang jurusan + termin-nya sama dengan isi keranjang,
     tapi belum dimiliki & belum ada di keranjang — biar relevan sama
     kebutuhan ujian termin siswa saat ini */
  const rekomendasi = useMemo(() => {
    if (rows.length === 0) return [];
    const kombinasi = new Set(rows.map((r) => `${r.jurusan}|${r.termin}`));
    return katalog.filter((m) =>
      m.status !== "soon" &&
      !dimilikiIds.includes(m.id) &&
      !ids.includes(m.id) &&
      kombinasi.has(`${m.jurusan}|${m.termin}`)
    ).slice(0, 6);
  }, [katalog, rows, ids, dimilikiIds]);

  const subtotal = rows.reduce((s, r) => s + (r.harga || 0), 0);
  const total = Math.max(subtotal - diskon, 0);

  const panggilFungsi = async (payload) => {
    if (!SB_AKTIF) throw new Error("Mode demo — pembayaran cuma aktif kalau Supabase sudah tersambung.");
    if (!CHECKOUT_FN_URL) throw new Error("Sistem checkout belum di-setting. Hubungi admin ya.");
    const { data: sesi } = await sb.auth.getSession();
    const token = sesi && sesi.session && sesi.session.access_token;
    const res = await fetch(CHECKOUT_FN_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json", Authorization: `Bearer ${token}` },
      body: JSON.stringify(payload),
    });
    const json = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(json.error || "Terjadi kesalahan.");
    return json;
  };

  /* Selalu preview ke server tiap isi keranjang / voucher aktif berubah —
     ini juga yang bikin DISKON OTOMATIS (beli 3+ / bundle lengkap) ke-apply
     duluan meskipun siswa nggak masukin kode voucher sama sekali. Server
     yang nentuin mana yang dipakai (otomatis vs voucher, ambil yang paling
     gede), sini cuma nampilin hasilnya. */
  useEffect(() => {
    let batal = false;
    (async () => {
      if (!SB_AKTIF || rows.length === 0) { setDiskon(0); setDiskonLabel(""); return; }
      try {
        const hasil = await panggilFungsi({
          itemIds: rows.map((r) => r.id),
          voucherKode: voucherAktif || undefined,
          preview: true,
        });
        if (batal) return;
        setDiskon(hasil.diskon || 0);
        setDiskonLabel(hasil.diskonLabel || "");
      } catch (e) {
        if (!batal) { setDiskon(0); setDiskonLabel(""); }
      }
    })();
    return () => { batal = true; };
  }, [rows.map((r) => r.id).join(","), voucherAktif]);

  const terapkanVoucher = async () => {
    const kode = voucherInput.trim();
    if (!kode) return;
    setCekVoucher(true); setPesanVoucher("");
    try {
      const hasil = await panggilFungsi({ itemIds: rows.map((r) => r.id), voucherKode: kode, preview: true });
      if (hasil.voucherValid) {
        setVoucherAktif(kode); setPesanVoucher("");
        // diskon & diskonLabel otomatis kesinkron lewat useEffect di atas
      } else {
        setVoucherAktif(""); setPesanVoucher(hasil.pesanVoucher || "Voucher tidak valid.");
      }
    } catch (e) {
      setPesanVoucher(e.message);
    } finally {
      setCekVoucher(false);
    }
  };

  const hapusVoucher = () => { setVoucherInput(""); setVoucherAktif(""); setPesanVoucher(""); };

  const noHpValid = /^0[0-9]{8,14}$/.test(noHp.trim());

  const bayar = async () => {
    if (rows.length === 0) return;
    if (!noHpValid) { setGalatBayar("Isi nomor HP yang valid dulu ya (contoh: 081234567890)."); return; }
    setMembayar(true); setGalatBayar("");
    try {
      localStorage.setItem("ahlan_no_hp", noHp.trim());
      const hasil = await panggilFungsi({ itemIds: rows.map((r) => r.id), voucherKode: voucherAktif || undefined, mobile: noHp.trim() });
      cartClear();
      if (hasil.free) {
        setGratisSukses(true);
      } else if (hasil.link) {
        setMayarLink(hasil.link);
      }
    } catch (e) {
      setGalatBayar(e.message);
    } finally {
      setMembayar(false);
    }
  };

  /* ---- Tampilan: lagi bayar (iframe Mayar) ---- */
  if (mayarLink) {
    /* Mayar butuh parameter ?iframe=true biar halaman pembayarannya mau
       ditampilkan di dalam <iframe> — tanpa ini, mereka nolak (anggap
       upaya framing yang mencurigakan) dan nunjukin pesan gagal. */
    const mayarLinkIframe = mayarLink + (mayarLink.includes("?") ? "&" : "?") + "iframe=true";
    return (
      <div className="fixed inset-0 z-[70] bg-ink/60 backdrop-blur-sm flex items-center justify-center p-0 sm:p-4">
        <div className="relative bg-white w-full h-full sm:h-[85vh] sm:max-w-lg sm:rounded-3xl overflow-hidden flex flex-col shadow-card">
          <div className="flex items-center justify-between px-4 py-3 border-b border-sky/15 shrink-0">
            <p className="font-display font-bold text-deep text-sm">Pembayaran Mayar</p>
            <button onClick={() => setMayarLink("")} aria-label="Tutup" className="w-8 h-8 rounded-full grid place-items-center text-ink/50 hover:bg-sky/10 transition"><IcClose className="w-5 h-5" /></button>
          </div>

                    <button onClick={terapkanVoucher} disabled={cekVoucher || !voucherInput.trim()}

              {/* Nomor HP — wajib, dibutuhkan Mayar buat proses pembayaran */}

                <p className="text-xs font-semibold uppercase tracking-wide text-ink/50 mb-2">Nomor HP (buat konfirmasi pembayaran)</p>

                   className="w-full rounded-full border border-sky/25 bg-white px-4 py-2.5 text-sm focus:outline-none focus:border-sea" />

              {/* Rincian harga */}
              <div className="mt-5 space-y-2 text-sm bg-paper/60 rounded-2xl border border-sky/15 p-4">

                {diskon > 0 && (
                  <div className="flex items-center justify-between">
                    <span className="text-ink/55">{diskonLabel || "Diskon"}</span>
                    <span className="text-sea font-semibold">− {idr(diskon)}</span>
                  </div>
                )}

                <div className="flex items-baseline justify-between pt-0.5">
                  <span className="font-display font-semibold text-ink">Total Bayar</span>
                  <span className="font-display font-bold text-sun text-xl">{idr(total)}</span>
                </div>
              </div>

              {/* Info metode pembayaran */}
              <div className="mt-5">
                <p className="text-xs font-semibold text-sea uppercase tracking-wide mb-2.5">Bisa Bayar Pakai</p>
                <div className="grid grid-cols-4 gap-2">
                  {[
                    { label: "QRIS", icon: <IcQr className="w-4 h-4" />, bg: "bg-ink", fg: "text-white" },
                    { label: "Transfer Bank", icon: <IcBank className="w-4 h-4" />, bg: "bg-sea", fg: "text-white" },
                    { label: "GoPay", icon: <IcWallet className="w-4 h-4" />, bg: "bg-[#00AA13]", fg: "text-white" },
                    { label: "OVO", icon: <IcWallet className="w-4 h-4" />, bg: "bg-[#4C3494]", fg: "text-white" },
                    { label: "DANA", icon: <IcWallet className="w-4 h-4" />, bg: "bg-[#118EEA]", fg: "text-white" },
                    { label: "ShopeePay", icon: <IcWallet className="w-4 h-4" />, bg: "bg-[#EE4D2D]", fg: "text-white" },
                    { label: "Kartu Debit/Kredit", icon: <IcCard className="w-4 h-4" />, bg: "bg-deep", fg: "text-white" },
                  ].map((m) => (
                    <div key={m.label} className="flex flex-col items-center gap-1.5 bg-white rounded-2xl border border-sky/15 py-3 px-1">
                      <span className={`w-8 h-8 rounded-full grid place-items-center ${m.bg} ${m.fg}`}>{m.icon}</span>
                      <span className="text-[9.5px] font-semibold text-ink/65 text-center leading-tight">{m.label}</span>
                    </div>
                  ))}
                </div>
                <p className="text-[11px] text-ink/45 mt-2.5">Diproses aman lewat Mayar.id — metode yang tersedia bisa beda tergantung jumlah tagihan.</p>
              </div>

              {galatBayar && <p className="mt-3 text-sm text-red-700 bg-red-50 border border-red-100 rounded-2xl px-4 py-3">{galatBayar}</p>}

              <button onClick={bayar} disabled={membayar}
                 className="mt-5 w-full inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold py-3.5 text-base shadow-soft hover:brightness-105 active:scale-[0.98] transition disabled:opacity-50">
                {membayar ? "Menyiapkan pembayaran…" : `Bayar ${idr(total)}`}
                {!membayar && <IcArrow className="w-5 h-5" />}
              </button>
            </div>
          </div>
        )}
      </div>
    </main>
  );
}

/* ================= NAVIGASI JURUSAN (sticky) ================= */
function PengajarJurusanNav() {
  const [active, setActive] = useState("ushuluddin");
  useEffect(() => {
    const ids = ["ushuluddin", "syariah"];
    const onScroll = () => {
      let current = ids[0];
      ids.forEach((id) => {
        const el = document.getElementById(id);
        if (el && el.getBoundingClientRect().top <= 180) current = id;
      });
      setActive(current);
    };
    onScroll();
    window.addEventListener("scroll", onScroll, { passive: true });
    return () => window.removeEventListener("scroll", onScroll);
  }, []);
  const items = [["ushuluddin", "Ushuluddin"], ["syariah", "Syariah"]];
  return (
    <div className="sticky top-16 z-30 bg-paper/85 backdrop-blur-md border-y border-sky/15">
      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-2.5 flex items-center gap-2 overflow-x-auto">
        <span className="hidden sm:inline text-[11px] uppercase tracking-widest text-ink/40 font-semibold mr-1 shrink-0">Jurusan</span>
        {items.map(([id, label]) => (
          <a key={id} href={"#" + id}
             className={`shrink-0 rounded-full px-4 py-1.5 text-sm font-medium transition-all ${
               active === id
                 ? "bg-sun text-white shadow-soft"
                 : "bg-white text-ink/70 border border-sky/25 hover:border-sun hover:text-sun"
             }`}>
            {label}
          </a>
        ))}
      </div>
    </div>
  );
}

/* ==========================================================================
   PEMUTAR VIDEO (YouTube IFrame API + fallback iframe biasa)
   ========================================================================== */
let ytApiPromise = null;
function loadYTApi() {
  if (window.YT && window.YT.Player) return Promise.resolve(window.YT);
  if (ytApiPromise) return ytApiPromise;
  ytApiPromise = new Promise((resolve, reject) => {
    const prev = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = () => { if (typeof prev === "function") prev(); resolve(window.YT); };
    const s = document.createElement("script");
    s.src = "https://www.youtube.com/iframe_api";
    s.onerror = reject;
    document.head.appendChild(s);
    setTimeout(() => { if (!(window.YT && window.YT.Player)) reject(new Error("timeout")); }, 9000);
  });
  return ytApiPromise;
}

function VideoPlayer({ playlistId, videoId, index, onEnded, onIndexChange }) {
  const [mulai, setMulai] = useState(false);

  /* Belum diklik play sama sekali — tampilkan poster pakai thumbnail asli videonya */
  if (!mulai) {
    return (
      <button onClick={() => setMulai(true)}
        className="absolute inset-0 w-full h-full bg-deep bg-cover bg-center grid place-items-center group cursor-pointer"
        style={videoId ? { backgroundImage: `url(https://i.ytimg.com/vi/${videoId}/hqdefault.jpg)` } : undefined}>
        <span className="absolute inset-0 bg-deep/35 group-hover:bg-deep/45 transition-colors" />
        <span className="relative w-16 h-16 sm:w-20 sm:h-20 rounded-full bg-white/95 grid place-items-center shadow-lg transition-transform group-hover:scale-105 group-active:scale-95">
          <svg viewBox="0 0 24 24" className="w-7 h-7 sm:w-8 sm:h-8 text-sea ml-1" fill="currentColor"><path d="M8 5v14l11-7z" /></svg>
        </span>
        <span className="absolute bottom-5 text-white text-xs sm:text-sm font-semibold drop-shadow">Klik untuk mulai nonton</span>
      </button>
    );
  }

  /* Sudah diklik play — render iframe langsung.
     Prioritas: pakai video_id episode itu sendiri (paling akurat, tiap episode
     video-nya beda-beda). Playlist+index dipakai HANYA kalau video_id kosong,
     sebagai fallback saja — karena bergantung urutan playlist YouTube yang
     harus persis sama urutannya dengan episode di database (rawan salah). */
  const src = videoId
    ? `https://www.youtube-nocookie.com/embed/${videoId}?rel=0&modestbranding=1&autoplay=1&controls=1`
    : `https://www.youtube-nocookie.com/embed/videoseries?list=${playlistId}&index=${index + 1}&rel=0&modestbranding=1&autoplay=1&controls=1`;

  return (
    <iframe
      key={videoId || `${playlistId}-${index}`}
      className="absolute inset-0 w-full h-full"
      src={src}
      title="Video pembelajaran"
      allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
      allowFullScreen
    />
  );
}

/* ==========================================================================

function QuizModal({ open, onClose, maddah, onFinish }) {
  const soal = (maddah && maddah.quiz && maddah.quiz.length ? maddah.quiz : (maddah && QUIZ_BANK[maddah.id])) || [];
  const [i, setI] = useState(0);
  const [answers, setAnswers] = useState([]);
  const [picked, setPicked] = useState(null);
  const [selesai, setSelesai] = useState(false);

  useEffect(() => { if (open) { setI(0); setAnswers([]); setPicked(null); setSelesai(false); } }, [open, maddah]);
  if (!open || !maddah || soal.length === 0) return null;

  const benar = answers.filter((a, k) => a === soal[k].a).length;
  const score = Math.round((benar / soal.length) * 100);

  const pilih = (k) => { if (picked !== null) return; setPicked(k); setAnswers((prev) => [...prev, k]); };
  const lanjut = () => {
    if (i + 1 < soal.length) { setI(i + 1); setPicked(null); }
    else {
      const b = [...answers].filter((a, k) => a === soal[k].a).length;
      const s = Math.round((b / soal.length) * 100);
      setSelesai(true);
      onFinish({ score: s, benar: b, total: soal.length, predikat: predikatOf(s) });
    }
  };
  const ulangi = () => { setI(0); setAnswers([]); setPicked(null); setSelesai(false); };

  const q = soal[i];

  return (
    <Modal open={open} onClose={onClose} size="lg" labelledBy="quiz-title">
      <ModalHead id="quiz-title" title="Kuis Digital" subtitle={`${maddah.name} — ${maddah.jurusan} Tk. ${maddah.tingkat}, Termin ${maddah.termin}`} onClose={onClose} />

      {!selesai ? (
        <div className="p-5 sm:p-7">
          <div className="flex items-center justify-between text-xs font-semibold text-ink/55">
            <span>Soal {i + 1} dari {soal.length}</span>
            <span>{answers.length > 0 ? `${answers.filter((a, k) => a === soal[k].a).length} benar` : "Semangat!"}</span>
          </div>
          <ProgressBar value={pct(i, soal.length)} className="mt-2" tone="sea" />

          <h4 className="font-display font-bold text-lg sm:text-xl text-deep mt-6 leading-snug">{q.q}</h4>

          <div className="mt-4 grid gap-2.5">
            {q.opts.map((o, k) => {
              const isRight = k === q.a;
              const chosen = picked === k;
              let cls = "border-sky/25 hover:border-sea hover:bg-sky/8";
              if (picked !== null) {
                if (isRight) cls = "border-emerald-400 bg-emerald-50";
                else if (chosen) cls = "border-red-300 bg-red-50";
                else cls = "border-sky/15 opacity-55";
              }
              return (
                <button key={k} onClick={() => pilih(k)} disabled={picked !== null}
                  className={`w-full text-left rounded-2xl border-2 px-4 py-3.5 transition flex items-start gap-3 ${cls}`}>
                  <span className={`shrink-0 w-7 h-7 rounded-full grid place-items-center text-xs font-bold mt-0.5
                    ${picked !== null && isRight ? "bg-emerald-500 text-white" : picked !== null && chosen ? "bg-red-400 text-white" : "bg-sky/15 text-sea"}`}>
                    {String.fromCharCode(65 + k)}
                  </span>
                  <span className="text-sm text-ink/85 leading-relaxed flex-1">{o}</span>
                </button>
              );
            })}
          </div>

          {picked !== null && (
            <div className={`mt-4 rounded-2xl p-4 pop-in ${picked === q.a ? "bg-emerald-50 border border-emerald-200" : "bg-amber-50 border border-amber-200"}`}>
              <p className={`font-semibold text-sm ${picked === q.a ? "text-emerald-700" : "text-amber-700"}`}>
                {picked === q.a ? "Ahsant! Jawabanmu benar." : "Belum tepat. Jawaban yang benar: " + String.fromCharCode(65 + q.a) + "."}
              </p>
              <p className="text-sm text-ink/70 mt-1.5 leading-relaxed">{q.exp}</p>
            </div>
          )}

          <div className="mt-6 flex justify-end">
            <button onClick={lanjut} disabled={picked === null}
              className="inline-flex items-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3 text-sm shadow-soft hover:brightness-105 active:scale-[.98] transition disabled:opacity-40">
              {i + 1 < soal.length ? "Soal Berikutnya" : "Lihat Hasil"} <IcArrow className="w-4 h-4" />
            </button>
          </div>
        </div>
      ) : (
        <div className="p-6 sm:p-9 text-center">
          <div className="w-24 h-24 mx-auto rounded-full grid place-items-center bg-gradient-to-br from-sea to-deep text-white shadow-card">
            <div>
              <p className="font-display font-bold text-2xl leading-none">{score}%</p>
              <p className="text-[10px] text-white/70 mt-0.5">Nilai</p>
            </div>
          </div>
          <h4 className="font-display font-bold text-2xl text-deep mt-5">{predikatOf(score)}</h4>
          <p className="text-ink/65 text-sm mt-1.5">
            {benar} dari {soal.length} soal terjawab benar.
            {score >= 75 ? " Mantap, pemahamanmu sudah solid!" : " Ulangi videonya sebentar, lalu coba kuis lagi ya."}
          </p>

          <div className="mt-6 text-left rounded-2xl border border-sky/18 divide-y divide-sky/12 max-h-64 overflow-y-auto nice-scroll">
            {soal.map((s, k) => {
              const ok = answers[k] === s.a;
              return (
                <div key={k} className="p-3.5 flex items-start gap-3">
                  <span className={`shrink-0 w-6 h-6 rounded-full grid place-items-center text-white mt-0.5 ${ok ? "bg-emerald-500" : "bg-red-400"}`}>
                    {ok ? <IcCheck className="w-3.5 h-3.5" stroke={3} /> : <IcClose className="w-3.5 h-3.5" />}
                  </span>
                  <div className="min-w-0">
                    <p className="text-sm font-medium text-ink/85 leading-snug">{k + 1}. {s.q}</p>
                    {!ok && <p className="text-xs text-ink/55 mt-1">Jawaban benar: <b className="text-sea">{s.opts[s.a]}</b></p>}
                  </div>
                </div>
              );
            })}
          </div>

          <div className="mt-6 flex flex-col sm:flex-row gap-2.5 justify-center">
            <button onClick={ulangi} className="inline-flex items-center justify-center gap-2 rounded-full border-2 border-sky/30 text-sea font-semibold px-6 py-3 text-sm hover:border-sea transition">
              Ulangi Kuis
            </button>
            <button onClick={onClose} className="inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3 text-sm shadow-soft hover:brightness-105 transition">
              Selesai <IcCheck className="w-4 h-4" stroke={3} />
            </button>
          </div>
        </div>
      )}
    </Modal>
  );
}

/* ==========================================================================
   MODAL SERTIFIKAT
   ========================================================================== */
function drawCertificate(canvas, data) {
  const W = 4000, H = 2828;   // dimensi asli gambar template = 2x canvas versi sebelumnya
  canvas.width = W; canvas.height = H;
  const ctx = canvas.getContext("2d");

  // Latar: gambar template (border + logo + hashtag sudah ada di dalamnya)
  ctx.fillStyle = "#FFFFFF"; ctx.fillRect(0, 0, W, H);
  if (data.templateImg) {
    try { ctx.drawImage(data.templateImg, 0, 0, W, H); } catch (e) {}
  }

  const cx = W / 2;
  ctx.textAlign = "center";

  /* Posisi & ukuran font di bawah ini adalah skala 2x persis dari layout
     versi kode sebelumnya (canvas lama 2000x1414 → sekarang 4000x2828),
     supaya proporsi/spacing-nya identik dengan desain yang jadi acuan. */

  // Judul
  ctx.fillStyle = "#0C5E6E"; ctx.font = "700 172px 'Host Grotesk', sans-serif";
  ctx.fillText("SERTIFIKAT KELULUSAN", cx, 860);
  ctx.strokeStyle = "#F89210"; ctx.lineWidth = 12;
  ctx.beginPath(); ctx.moveTo(cx - 340, 930); ctx.lineTo(cx + 340, 930); ctx.stroke();

  ctx.fillStyle = "#123B42"; ctx.font = "400 64px Poppins, sans-serif";
  ctx.fillText("Diberikan dengan bangga kepada", cx, 1080);

  // Nama
  ctx.fillStyle = "#148499"; ctx.font = "700 208px 'Host Grotesk', sans-serif";
  const nama = (data.name || "").toUpperCase();
  let fs = 208;
  while (ctx.measureText(nama).width > W - 800 && fs > 88) { fs -= 8; ctx.font = `700 ${fs}px 'Host Grotesk', sans-serif`; }
  ctx.fillText(nama, cx, 1320);
  ctx.strokeStyle = "rgba(18,59,66,.22)"; ctx.lineWidth = 6;
  ctx.beginPath(); ctx.moveTo(cx - 1040, 1400); ctx.lineTo(cx + 1040, 1400); ctx.stroke();

  // Keterangan
  ctx.fillStyle = "#123B42"; ctx.font = "400 64px Poppins, sans-serif";
  ctx.fillText("atas keberhasilannya menuntaskan seluruh materi bimbel muqarrar", cx, 1540);

  ctx.fillStyle = "#0C5E6E"; ctx.font = "700 120px 'Host Grotesk', sans-serif";
  ctx.fillText(data.maddah, cx, 1704);
  ctx.fillStyle = "#148499"; ctx.font = "500 60px Poppins, sans-serif";
  ctx.fillText(data.meta, cx, 1812);

  if (data.predikat) {
    ctx.fillStyle = "#F89210"; ctx.font = "600 68px Poppins, sans-serif";
    ctx.fillText("Predikat Kuis: " + data.predikat, cx, 1936);
  }

  // Tanggal — kiri bawah (posisi sama seperti "kaki" di layout sebelumnya, skala 2x)
  ctx.textAlign = "left";
  ctx.fillStyle = "#123B42"; ctx.font = "400 52px Poppins, sans-serif";
  ctx.fillText(data.dateStr, 400, 2360);
  ctx.fillStyle = "rgba(18,59,66,.55)"; ctx.font = "400 44px Poppins, sans-serif";
  ctx.fillText("No. " + data.certNo, 400, 2450);
}

function CertificateModal({ open, onClose, maddah, user, quizResult }) {
  const [nama, setNama] = useState("");
  const [preview, setPreview] = useState("");
  const [busy, setBusy] = useState(false);
  const canvasRef = useRef(null);
  const templateRef = useRef(null);

  useEffect(() => {
    if (open) { setNama((user && user.name) || ""); setPreview(""); }
  }, [open, user]);

  useEffect(() => {
    const img = new Image();
    img.onload = () => { templateRef.current = img; };
    img.onerror = () => { templateRef.current = null; };
    img.src = SERTIFIKAT_TEMPLATE_IMG;
  }, []);

  if (!open || !maddah) return null;

  const certNo = `AA/${maddah.jurusan.slice(0, 3).toUpperCase()}${maddah.tingkat}-T${maddah.termin}/${new Date().getFullYear()}/${String(Math.abs(hashCode(maddah.id + (nama || "x")))).slice(0, 5)}`;

  const build = async () => {
    const canvas = canvasRef.current || document.createElement("canvas");
    canvasRef.current = canvas;
    try { if (document.fonts && document.fonts.ready) await document.fonts.ready; } catch (e) {}
    drawCertificate(canvas, {
      name: nama.trim(),
      maddah: maddah.name,
      meta: `${maddah.jurusan} Tingkat ${maddah.tingkat} — Termin ${maddah.termin} · ${maddah.tahun}`,
      predikat: quizResult ? quizResult.predikat : "",
      dateStr: tanggalID(new Date()),
      certNo,
      templateImg: templateRef.current,
    });
    return canvas;
  };

  const lihat = async () => {
    if (!nama.trim()) return;
    setBusy(true);
    const canvas = await build();
    try { setPreview(canvas.toDataURL("image/png")); }
    catch (e) { templateRef.current = null; const c2 = await build(); try { setPreview(c2.toDataURL("image/png")); } catch (e2) { setPreview(""); } }
    setBusy(false);
  };

  const unduh = async () => {
    if (!nama.trim()) return;
    setBusy(true);
    const canvas = await build();
    const finish = (url, revoke) => {
      const a = document.createElement("a");
      a.href = url;
      a.download = `Sertifikat-${maddah.name.replace(/\s+/g, "-")}-${nama.trim().replace(/\s+/g, "-")}.png`;
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      if (revoke) setTimeout(() => URL.revokeObjectURL(url), 2000);
      setBusy(false);
    };
    try {
      if (canvas.toBlob) canvas.toBlob((blob) => finish(URL.createObjectURL(blob), true), "image/png");
      else finish(canvas.toDataURL("image/png"), false);
    } catch (e) {
      templateRef.current = null;
      const c2 = await build();
      finish(c2.toDataURL("image/png"), false);
    }
  };

  return (
    <Modal open={open} onClose={onClose} size="lg" labelledBy="cert-title">
      <ModalHead id="cert-title" title="Unduh Sertifikat" subtitle={`${maddah.name} — ${maddah.jurusan} Tk. ${maddah.tingkat}, Termin ${maddah.termin}`} onClose={onClose} />
      <div className="p-5 sm:p-7">
        <div className="rounded-2xl bg-sand/60 border border-sun/20 p-4 flex items-start gap-3">
          <span className="shrink-0 w-9 h-9 rounded-xl bg-sun text-white grid place-items-center"><IcCap className="w-5 h-5" /></span>
          <p className="text-sm text-ink/75 leading-relaxed">
            Barakallahu fiik! Kamu sudah menuntaskan seluruh video maddah ini. Tulis namamu sesuai yang ingin tercetak di sertifikat, lalu unduh.
          </p>
        </div>

        <label className="block mt-5 text-sm font-semibold text-deep">Nama lengkap di sertifikat</label>
        <input
          value={nama}
          onChange={(e) => { setNama(e.target.value); setPreview(""); }}
          placeholder="Contoh: Rama Adhitia"
          maxLength={48}
          className="mt-2 w-full rounded-2xl border border-sky/25 bg-paper/60 px-4 py-3.5 text-ink placeholder:text-ink/35 focus:outline-none focus:ring-2 focus:ring-sea/30 focus:border-sea"
        />
        <p className="text-xs text-ink/45 mt-1.5">Pakai huruf kapital di awal kata ya, biar rapi waktu tercetak.</p>

        {quizResult && (
          <p className="text-xs text-sea font-semibold mt-3 inline-flex items-center gap-1.5">
            <IcQuiz className="w-4 h-4" /> Predikat kuis "{quizResult.predikat}" akan ikut tercantum di sertifikat.
          </p>
        )}

        {preview && (
          <div className="mt-5 rounded-2xl overflow-hidden border border-sky/20 shadow-soft pop-in">
            <img src={preview} alt="Pratinjau sertifikat" className="w-full" />
          </div>
        )}

        <div className="mt-6 flex flex-col sm:flex-row gap-2.5">
          <button onClick={lihat} disabled={!nama.trim() || busy}
            className="flex-1 inline-flex items-center justify-center gap-2 rounded-full border-2 border-sky/30 text-sea font-semibold px-6 py-3.5 text-sm hover:border-sea transition disabled:opacity-40">
            Lihat Pratinjau
          </button>
          <button onClick={unduh} disabled={!nama.trim() || busy}
            className="flex-1 inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3.5 text-sm shadow-soft hover:brightness-105 active:scale-[.98] transition disabled:opacity-40">
            <IcDownload className="w-4 h-4" /> {busy ? "Menyiapkan…" : "Unduh Sertifikat"}
          </button>
        </div>
        <canvas ref={canvasRef} className="hidden" />
      </div>
    </Modal>
  );
}

function hashCode(str) {
  let h = 0;
  for (let i = 0; i < str.length; i++) { h = (h << 5) - h + str.charCodeAt(i); h |= 0; }
  return h;
}

   MODAL REVIEW
   ========================================================================== */
function ReviewModal({ open, onClose, maddah, existing, onSubmit }) {
  const [rating, setRating] = useState(0);
  const [hover, setHover] = useState(0);
  const [teks, setTeks] = useState("");
  const [boleh, setBoleh] = useState(true);
  const [sukses, setSukses] = useState(false);
  const [kirimSedangJalan, setKirimSedangJalan] = useState(false);
  const [galat, setGalat] = useState("");

  /* PENTING: dependency-nya cuma [open, maddah?.id] — BUKAN [open, existing].
     Kalau ikut "existing", begitu review baru saja tersimpan (existing berubah),
     effect ini ikut nyala lagi dan bikin form ke-reset balik ke form kosong —
     itu penyebab "kayak nggak kekirim" padahal sebenarnya sudah tersimpan. */
  useEffect(() => {
    if (open) {
      setRating(existing ? existing.rating : 0);
      setTeks(existing ? existing.text : "");
      setBoleh(existing ? existing.public : true);
      setSukses(false); setHover(0); setGalat("");
    }
  }, [open, maddah && maddah.id]);

  if (!open || !maddah) return null;

  const label = ["", "Kurang", "Cukup", "Lumayan", "Bagus", "Luar biasa"][hover || rating] || "Kasih bintangmu";

  const kirim = async () => {
    if (!rating || kirimSedangJalan) return;
    setKirimSedangJalan(true); setGalat("");
    try {
      await onSubmit({ rating, text: teks.trim(), public: boleh, at: new Date().toISOString() });
      setSukses(true);
    } catch (e) {
      console.error(e);
      setGalat("Gagal mengirim review. Coba lagi sebentar lagi ya.");
    } finally {
      setKirimSedangJalan(false);
    }
  };

  return (
    <Modal open={open} onClose={onClose} labelledBy="rev-title">
      <ModalHead id="rev-title" title="Kasih Review" subtitle={`${maddah.name} — ${maddah.teacher}`} onClose={onClose} />
      {!sukses ? (
        <div className="p-5 sm:p-7">
          <p className="text-sm text-ink/65 leading-relaxed">
            Reviewmu bantu kami memperbaiki kualitas kelas, sekaligus bantu teman-teman Masisir lain memilih maddah. Jazakallahu khairan!
          </p>

          <div className="mt-6 text-center">
            <div className="inline-flex items-center gap-1.5" onMouseLeave={() => setHover(0)}>
              {[1, 2, 3, 4, 5].map((n) => (
                <button key={n} onClick={() => setRating(n)} onMouseEnter={() => setHover(n)} aria-label={`${n} bintang`}
                  className="p-1 transition-transform hover:scale-110 active:scale-95">
                  <IcStar className={`w-9 h-9 transition-colors ${(hover || rating) >= n ? "text-sun" : "text-sky/30"}`} />
                </button>
              ))}
            </div>
            <p className="text-sm font-semibold text-ink/70 mt-1.5">{label}</p>
          </div>

          <label className="block mt-6 text-sm font-semibold text-deep">Ceritakan pengalamanmu (opsional)</label>
          <textarea
            value={teks} onChange={(e) => setTeks(e.target.value)} rows={4} maxLength={400}
            placeholder="Contoh: Penjelasan ustadznya runtut dan gampang dipahami, rangkumannya sangat membantu waktu H-1 ujian…"
            className="mt-2 w-full rounded-2xl border border-sky/25 bg-paper/60 px-4 py-3 text-sm text-ink placeholder:text-ink/35 focus:outline-none focus:ring-2 focus:ring-sea/30 focus:border-sea resize-y"
          />
          <p className="text-xs text-ink/40 mt-1 text-right">{teks.length}/400</p>

          <label className="mt-3 flex items-start gap-2.5 cursor-pointer">
            <input type="checkbox" checked={boleh} onChange={(e) => setBoleh(e.target.checked)} className="mt-1 w-4 h-4 accent-sea" />
            <span className="text-sm text-ink/65 leading-relaxed">Boleh ditampilkan sebagai testimoni di website Ahlan Akademi.</span>
          </label>

          {galat && (
            <p className="mt-3 text-sm text-red-700 bg-red-50 border border-red-100 rounded-2xl px-4 py-2.5">{galat}</p>
          )}

          <div className="mt-6 flex flex-col sm:flex-row gap-2.5">
            <button onClick={onClose} className="sm:w-32 inline-flex items-center justify-center rounded-full border-2 border-sky/30 text-ink/70 font-semibold px-6 py-3.5 text-sm hover:border-ink/30 transition">Nanti aja</button>
            <button onClick={kirim} disabled={!rating || kirimSedangJalan}
              className="flex-1 inline-flex items-center justify-center gap-2 rounded-full bg-sun text-white font-semibold px-6 py-3.5 text-sm shadow-soft hover:brightness-105 active:scale-[.98] transition disabled:opacity-40">
              {kirimSedangJalan ? "Mengirim…" : "Kirim Review"} {!kirimSedangJalan && <IcArrow className="w-4 h-4" />}
            </button>
          </div>
        </div>
      ) : (
        <div className="p-8 sm:p-10 text-center">
          <span className="w-16 h-16 rounded-full bg-emerald-500 text-white grid place-items-center mx-auto"><IcCheck className="w-8 h-8" stroke={3} /></span>
          <h4 className="font-display font-bold text-xl text-deep mt-4">Jazakallahu khairan!</h4>
          <p className="text-sm text-ink/65 mt-2 leading-relaxed max-w-sm mx-auto">
            Review kamu sudah kami terima. Masukanmu sangat berarti buat pengembangan kelas berikutnya.
          </p>
          <button onClick={onClose} className="mt-6 inline-flex items-center justify-center gap-2 rounded-full bg-sea text-white font-semibold px-7 py-3 text-sm hover:brightness-110 transition">Tutup</button>
        </div>
      )}
    </Modal>
  );
}

  useReveal();

  const [user, setUser] = useState(() => (SB_AKTIF ? null : store.get("user", null)));
  const [cekSesi, setCekSesi] = useState(SB_AKTIF);   // true = masih memeriksa sesi login
  const [maddahList, setMaddahList] = useState(SB_AKTIF ? [] : MY_MADDAH);
  const [muatData, setMuatData] = useState(false);    // true = sedang ambil data maddah
  const [dataDimuat, setDataDimuat] = useState(!SB_AKTIF); // true = daftar maddah sudah pernah selesai dimuat (minimal sekali)
  const [galat, setGalat] = useState("");

  const [tab, setTab] = useState(() => {
    const p = new URLSearchParams(window.location.search);
    const t = p.get("tab");
    const TAB_VALID = ["kelas", "katalog", "tentang", "pengajar", "checkout"];
    return TAB_VALID.includes(t) ? t : "beranda";
  });
  const [activeId, setActiveId] = useState(() => new URLSearchParams(window.location.search).get("maddah") || null);

  const [progress, setProgress] = useState(() => store.get("progress", {}));
  const [reviews, setReviews]   = useState(() => store.get("reviews", {}));
  const [quiz, setQuiz]         = useState(() => store.get("quiz", {}));
  const [notes, setNotes]       = useState(() => store.get("notes", {}));

  const [quizOpen, setQuizOpen] = useState(false);
  const [certOpen, setCertOpen] = useState(false);
  const [revOpen, setRevOpen]   = useState(null); // id maddah
  const [detailMaddahId, setDetailMaddahId] = useState(null);

  useEffect(() => { store.set("progress", progress); }, [progress]);
  useEffect(() => { store.set("reviews", reviews); }, [reviews]);
  useEffect(() => { store.set("quiz", quiz); }, [quiz]);
  useEffect(() => { store.set("notes", notes); }, [notes]);
  useEffect(() => { if (!SB_AKTIF) store.set("user", user); }, [user]);

  /* --- Pantau status login Supabase ---------------------------------------
     onAuthStateChange langsung menyala saat halaman dibuka, jadi sekaligus
     berfungsi memulihkan sesi siswa yang sebelumnya sudah login. */
  useEffect(() => {
    if (!SB_AKTIF) return;
    const { data: sub } = sb.auth.onAuthStateChange((_event, session) => {
      if (session && session.user) {
        const u = session.user;
        setUser({
          id: u.id,
          email: u.email,
          name: (u.user_metadata && (u.user_metadata.full_name || u.user_metadata.name)) || u.email,
        });
        /* Bersihkan sisa hash #access_token=... dari OAuth redirect biar
           gak nyangkut di URL — kalau dibiarin, percobaan login berikutnya
           bisa gagal cocok sama Redirect URLs Supabase (lihat komentar di
           fungsi login). Query string (?tab=, ?maddah=, dst) tetap aman. */
        if (window.location.hash) {
          window.history.replaceState(null, "", window.location.pathname + window.location.search);
        }
      } else {
        setUser(null);
      }
      setCekSesi(false);
    });
    return () => sub.subscription.unsubscribe();
  }, []);

  /* --- Simpan/segarkan profil siswa, lalu ambil maddah miliknya ----------- */
  useEffect(() => {
    if (!SB_AKTIF || !user) return;
    let batal = false;

    (async () => {
      setMuatData(true); setGalat("");
      try {
        /* Catat profil (aman dipanggil berulang — upsert, bukan insert baru) */
        await sb.from("profiles").upsert({
          id: user.id, email: user.email, full_name: user.name,
        });

        const list = await ambilMaddahSiswa(user.id);
        if (!batal) setMaddahList(list);
      } catch (e) {
        console.error(e);
        if (!batal) setGalat("Gagal memuat data maddah. Periksa koneksi, lalu muat ulang halaman.");
      } finally {
        if (!batal) { setMuatData(false); setDataDimuat(true); }
      }
    })();

    return () => { batal = true; };
    /* sengaja bergantung pada user.id saja — Supabase menyegarkan token secara
       berkala dan itu membuat objek user baru; tanpa ini data akan diambil ulang
       terus-menerus tanpa perlu. */
  }, [user && user.id]);

  const keluar = async () => {
    if (SB_AKTIF) await sb.auth.signOut();
    setUser(null); setMaddahList(SB_AKTIF ? [] : MY_MADDAH);
    setTab("beranda"); setActiveId(null); setDataDimuat(!SB_AKTIF);
  };

  /* Kalau ada ?beli=<id> di URL (datang dari tombol "Daftar Bimbelnya" di
     katalog.html/maddah.html), masukkan ke keranjang & langsung buka
     checkout — sekali jalan aja pas halaman pertama dibuka. */
  useEffect(() => {
    const beliId = new URLSearchParams(window.location.search).get("beli");
    if (!beliId) return;
    cartAdd(beliId);
    setDetailMaddahId(null);
    setTab("checkout");
    const p = new URLSearchParams(window.location.search);
    p.delete("beli");
    const qs = p.toString();
    window.history.replaceState(null, "", window.location.pathname + (qs ? `?${qs}` : ""));
  }, []);

  const maddah = maddahList.find((m) => m.id === activeId) || null;

  /* Simpan tab + maddah yang lagi dibuka ke URL (bukan cuma state React) —
     supaya kalau halaman di-refresh (F5), posisinya nggak balik ke beranda. */
  useEffect(() => {
    const p = new URLSearchParams(window.location.search);
    if (tab === "kelas" && activeId) { p.set("tab", "kelas"); p.set("maddah", activeId); }
    else if (["katalog", "tentang", "pengajar", "checkout"].includes(tab)) { p.set("tab", tab); p.delete("maddah"); }
    else { p.delete("tab"); p.delete("maddah"); }
    const qs = p.toString();
    window.history.replaceState(null, "", window.location.pathname + (qs ? `?${qs}` : ""));
  }, [tab, activeId]);

  /* Kalau maddah dari URL ternyata sudah nggak ada/nggak berhak lagi
     (setelah data BENAR-BENAR selesai dimuat minimal sekali), baru balik ke
     beranda — bukan pas data masih kosong karena belum sempat diambil. */
  useEffect(() => {
    if (dataDimuat && !muatData && tab === "kelas" && !maddah) setTab("beranda");
  }, [dataDimuat, muatData, tab, maddah]);

  const bukaKelas = (id) => { setActiveId(id); setTab("kelas"); window.scrollTo({ top: 0, behavior: "auto" }); };
  const bukaCheckout = () => { setDetailMaddahId(null); setTab("checkout"); };

  const toggleWatch = (epIndex, val) => {
    if (!activeId) return;
    setProgress((prev) => {
      const cur = prev[activeId] || [];
      const next = val ? (cur.includes(epIndex) ? cur : [...cur, epIndex]) : cur.filter((i) => i !== epIndex);
      return { ...prev, [activeId]: next };
    });
  };

  if (cekSesi)  return <LayarTunggu teks="Memeriksa sesi masukmu…" />;
  if (!user)    return <LoginGate onLogin={(u) => setUser(u)} />;
  if (muatData) return <LayarTunggu teks="Menyiapkan ruang belajarmu…" />;

  const pindahTab = (t) => { if (t === "kelas" && !activeId) return; setDetailMaddahId(null); setTab(t); };

  return (
    <>
      <Navbar user={user} onLogout={keluar} tab={tab} onTab={pindahTab}
              canOpenClass={!!activeId} activeName={maddah ? maddah.name : ""}
              onCheckout={bukaCheckout} />

      <div className="pt-16">
        {detailMaddahId ? (
          <DetailMaddahView
            id={detailMaddahId}
            dimiliki={maddahList.map((m) => m.id).includes(detailMaddahId)}
            onBack={() => setDetailMaddahId(null)}
            onBuyNow={(idBeli) => { cartAdd(idBeli); bukaCheckout(); }}
          />
        ) : (
        <>
        {galat && (
          <div className="max-w-6xl mx-auto px-4 sm:px-6 pt-5">
            <p className="text-sm text-red-700 bg-red-50 border border-red-100 rounded-2xl px-4 py-3">{galat}</p>
          </div>
        )}

        {tab === "beranda" && (
          <Beranda
            user={user}
            maddahList={maddahList}
            progress={progress}
            reviews={reviews}
            quiz={quiz}
            onBelajar={bukaKelas}
            onReview={(id) => setRevOpen(id)}
            onKatalog={() => setTab("katalog")}
          />
        )}

        {tab === "katalog" && (
          <KatalogTab dimilikiIds={maddahList.map((m) => m.id)} onCheckout={bukaCheckout}
            onDetail={(id) => setDetailMaddahId(id)} />
        )}

        {tab === "tentang" && <TentangTab onKatalog={() => setTab("katalog")} />}

        {tab === "pengajar" && <PengajarTab onKatalog={() => setTab("katalog")} />}

        {tab === "checkout" && (
          <CheckoutPage
            dimilikiIds={maddahList.map((m) => m.id)}
            onKatalog={() => setTab("katalog")}
            onBeranda={() => setTab("beranda")}
          />
        )}

        {tab === "kelas" && maddah && (
          <ELearning
            key={maddah.id}
            maddah={maddah}
            watched={progress[maddah.id] || []}
            onToggleWatch={toggleWatch}
            onBack={() => setTab("beranda")}
            onOpenQuiz={() => setQuizOpen(true)}
            onOpenCert={() => setCertOpen(true)}
            onOpenReview={() => setRevOpen(maddah.id)}
            quizResult={quiz[maddah.id]}
            notes={notes[maddah.id] || ""}
            onNotes={(v) => setNotes((p) => ({ ...p, [maddah.id]: v }))}
          />
        )}
        </>
        )}
      </div>

      <Footer onKatalog={() => setTab("katalog")} />
      <FloatingPromo />
      <FloatingWA />

      <QuizModal
        open={quizOpen} onClose={() => setQuizOpen(false)} maddah={maddah}
        onFinish={(res) => setQuiz((p) => ({ ...p, [maddah.id]: res }))}
      />

      <CertificateModal
        open={certOpen} onClose={() => setCertOpen(false)} maddah={maddah}
        user={user} quizResult={maddah ? quiz[maddah.id] : null}
      />
      <ReviewModal
        open={!!revOpen} onClose={() => setRevOpen(null)}
        maddah={maddahList.find((m) => m.id === revOpen) || null}
        existing={revOpen ? reviews[revOpen] : null}
        onSubmit={async (r) => {
          if (SB_AKTIF && user) {
            const { error } = await sb.from("reviews").upsert({
              user_id: user.id,
              maddah_id: revOpen,
              rating: r.rating,
              comment: r.text,
              boleh_publik: r.public,
            }, { onConflict: "user_id,maddah_id" });
            if (error) throw error;
          }
          setReviews((p) => ({ ...p, [revOpen]: r }));
        }}
      />
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

</script>
</body>
</html>
